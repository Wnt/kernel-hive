<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420"
     role="img" aria-labelledby="t d">
  <title id="t">How Kernel Hive gets a 1990s desktop into a browser tab</title>
  <desc id="d">A browser decodes H.264 and Opus over WebTransport and sends pointer and keyboard
  events back; one streamhost daemon per machine captures, encodes and injects; behind it runs
  QEMU, MAME, FS-UAE or es40. A separate retronet plane serves an archived 1990s web and
  station-to-station chat with no route to the real internet.</desc>

  <style>
    .box   { fill: #8a8a8a; fill-opacity: .08; stroke: #8a8a8a; stroke-width: 1.25; rx: 10; }
    .h     { fill: #8a8a8a; font: 600 15px/1.2 ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif; }
    .l     { fill: #8a8a8a; font: 400 12.5px/1.2 ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif; }
    .s     { fill: #8a8a8a; font: 400 11px/1.2 ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif; }
    .k     { fill: #8a8a8a; font: 600 11px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .03em; }
    .wire  { fill: none; stroke: #8a8a8a; stroke-width: 1.5; }
    .dash  { fill: none; stroke: #8a8a8a; stroke-width: 1.25; stroke-dasharray: 5 4; }
    .cap   { fill: #8a8a8a; font: 600 12px/1.2 ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- column 1: the browser (x 16..216) -->
  <rect class="box" x="16" y="66" width="200" height="150"/>
  <text class="h" x="32" y="94">Your browser tab</text>
  <text class="l" x="32" y="120">React gallery UI</text>
  <text class="l" x="32" y="142">WebCodecs H.264 decode</text>
  <text class="l" x="32" y="164">Opus audio out</text>
  <text class="l" x="32" y="186">pointer, keys, wheel in</text>

  <!-- gap 1 (x 216..400): WebTransport -->
  <text class="cap" x="308" y="86" text-anchor="middle">WebTransport over QUIC</text>
  <text class="s" x="308" y="116" text-anchor="middle">H.264 video + Opus audio</text>
  <path class="wire" d="M390 126 H 226" marker-end="url(#a)"/>
  <text class="s" x="308" y="166" text-anchor="middle">pointer + keys, own streams</text>
  <path class="wire" d="M226 176 H 390" marker-end="url(#a)"/>

  <!-- column 2: the daemon (x 400..600) -->
  <rect class="box" x="400" y="66" width="200" height="150"/>
  <text class="h" x="416" y="94">streamhost</text>
  <text class="l" x="416" y="114">one Rust daemon per machine</text>
  <text class="l" x="416" y="142">damage-gated capture</text>
  <text class="l" x="416" y="164">in-process x264 + Opus</text>
  <text class="l" x="416" y="186">ticket gate, idle pause</text>

  <!-- gap 2 (x 600..776): capture and injection paths -->
  <text class="k" x="688" y="108" text-anchor="middle">shared memory</text>
  <path class="wire" d="M766 118 H 610" marker-end="url(#a)"/>
  <text class="k" x="688" y="146" text-anchor="middle">QMP / dbus</text>
  <path class="wire" d="M610 156 H 766" marker-end="url(#a)"/>
  <text class="k" x="688" y="184" text-anchor="middle">in-guest agent</text>
  <path class="wire" d="M610 194 H 766" marker-end="url(#a)"/>

  <!-- column 3: the emulators (x 776..944) -->
  <rect class="box" x="776" y="66" width="168" height="150"/>
  <text class="h" x="792" y="94">The machine</text>
  <text class="l" x="792" y="120">QEMU</text>
  <text class="l" x="792" y="142">MAME</text>
  <text class="l" x="792" y="164">FS-UAE</text>
  <text class="l" x="792" y="186">es40</text>

  <!-- the instant-ready note -->
  <path class="dash" d="M860 216 V 250"/>
  <rect class="box" x="668" y="250" width="276" height="62"/>
  <text class="cap" x="684" y="274">Starts at a checkpoint, paused</text>
  <text class="l" x="684" y="296">no boot to watch; the first visitor resumes it</text>

  <!-- the retronet plane -->
  <path class="dash" d="M668 281 H 340 V 312"/>
  <rect class="box" x="124" y="312" width="432" height="82"/>
  <text class="h" x="140" y="338">retronet — a 1990s internet with no way out</text>
  <text class="l" x="140" y="360">archived 1998 web pages, served over real HTTP/1.0</text>
  <text class="l" x="140" y="382">ICQ, AIM and IRC between the machines · no route to today</text>
</svg>
