# ruff config for the kernel-hive repo.
# Gate: ruff check . scripts/labctl   (labctl is python3 without a .py extension)
target-version = "py39"
line-length = 120

extend-exclude = [
  # Python 2.6 BY DESIGN — runs inside the Solaris 10 guest (no py3 there).
  "streamhost/guest-agents/solaris/warpd.py",
]

[lint]
select = ["E4", "E7", "E9", "F"]
# E401/E701/E702: the box CLIs use dense one-liner style deliberately
# (comma imports + semicolon statements); E741: short l/I names in tight
# framebuffer/geometry math.
ignore = ["E401", "E701", "E702", "E741"]
