#!/bin/bash
# bootrec-tiles.conf — per-tile capture parameters (DATA, sourced by record-boot.sh
# and detect-interactive.sh). `bootrec_load_tile <tile>` populates BR_* globals from
# the case block below; add a tile by adding a case arm. Values marked (box) must be
# confirmed against the live launcher before the first real record of that tile.
#
# Fields:
#   BR_BOOT_KIND   vmstate | bridge | restart
#       vmstate: cold-launch the clone WITHOUT loadvm golden, detect settle, pause,
#                poster, savevm golden ON THE PAUSED STATE, verify (the §3.1 invariant).
#       bridge : loadvm the kiosk golden, ssh the in-kiosk emulator cold-boot trigger,
#                record that; SKIP savevm/verify (the emulator cold-boots per visit).
#       restart: the boot artifact itself is golden (ISO/raw base/-snapshot disk);
#                record its deterministic cold boot, SKIP savevm/loadvm verification.
#   BR_CANVAS_W/H  final desktop resolution — the FIXED canvas the dbus tap normalises
#                  every frame to (letterboxing SeaBIOS/boot modes). Sidesteps §2.3.
#   BR_FPS         constant record fps the tap paces to (delivered clip; 30 is plenty).
#   BR_HAS_AUDIO   1 -> mux guest PCM (tap opens the audio fifo); 0 -> -an, no fifo.
#   BR_AUDIO_RATE/BR_AUDIO_CH  PCM format the tap emits (matches the tile -audiodev).
#   BR_HOSTFWD_ORIG/BR_HOSTFWD_CLONE  the launcher's guest hostfwd port and the bumped
#                  clone port (rewritten in the copied launcher; avoids colliding with
#                  the LIVE tile's forward).
#   BR_DISKS       space-separated qcow2 basenames under the tile dir to copy into the
#                  clone (savevm on a vmstate clone writes the COPY, never live).
#   BR_EXTERNAL_DISKS bash array of "absolute-source|clone-basename" entries. Each
#                  writable disk outside the tile dir is copied and its launcher path
#                  rewritten to the clone. Never point a clone at a live writable disk.
#   BR_GOLDEN_DISK basename of the clone disk whose snapshot list fingerprints the bake;
#                  defaults to the first BR_DISKS entry (set it for external stores).
#   BR_PORT_REWRITES bash array of "live:clone" fixed TCP ports not covered by hostfwd.
#   BR_DETECT_TIER 1 (framebuffer-stability) | 2 (reference-region) | 3 (fixed timer).
#   BR_CF_THRESHOLD/BR_SETTLE_MS         Tier-1: cf<thr held for settle window.
#   BR_REF_PNG/BR_REF_CROP/BR_REF_MATCH_K Tier-2: crop region SSIM vs a reference PNG,
#                  K consecutive matches (BR_REF_CROP is an ffmpeg crop=w:h:x:y).
#   BR_TIER3_TIMER_MS                    Tier-3: fixed settle wall-clock.
#   BR_MAX_MS      hard cap on the detect wait (all tiers) — a bounded recording.
#   BR_EMU_BOOT_CMD/BR_EMU_SSH_PORT/BR_EMU_SSH_KEY  bridge-only: cold-boot the in-kiosk
#                  emulator over ssh (the clone's bumped forward).
#   BR_EMU_PREP_CMD bridge-only optional command run before capture to stop the emulator,
#                  ensuring frame zero is the emulator's real powered-off/black surface.
#   BR_BOOT_DRIVER  optional sibling helper run after capture starts and before detection;
#                  automates unavoidable firmware/LiveCD dialogs (never human input).

bootrec_load_tile() {
  local t="$1"
  # ---- shared defaults (overridden per tile) ----
  BR_TILE="$t"
  BR_BOOT_KIND="vmstate"
  BR_CANVAS_W=640; BR_CANVAS_H=480; BR_FPS=30
  BR_CRF=18                       # delivered boot.mp4 x264 crf (compactness vs last-frame fidelity)
  BR_HAS_AUDIO=0; BR_AUDIO_RATE=48000; BR_AUDIO_CH=2
  BR_HOSTFWD_ORIG=""; BR_HOSTFWD_CLONE=""
  BR_DISKS=""
  BR_EXTERNAL_DISKS=(); BR_GOLDEN_DISK=""; BR_PORT_REWRITES=()
  BR_DETECT_TIER=1; BR_CF_THRESHOLD="0.005"; BR_SETTLE_MS=3000
  BR_REF_PNG=""; BR_REF_CROP=""; BR_REF_MATCH_K=3
  BR_TIER3_TIMER_MS=75000
  BR_MAX_MS=180000
  BR_EMU_PREP_CMD=""; BR_EMU_BOOT_CMD=""; BR_EMU_SSH_PORT=""; BR_EMU_SSH_KEY=""
  BR_BOOT_DRIVER=""

  case "$t" in
    amiga)  # emulator-bridge (FS-UAE in a Debian-12 kiosk); cold-boot per visit, no savevm.
      # All fields confirmed 2026-07-13 against the LIVE launcher
      # /data/vms/streamhost/tiles/amiga/qemu-streamhost.sh, the kiosk .xinitrc, and
      # /etc/bridge/launch.sh (via ssh -i bridge_key -p 5818 root@127.0.0.1).
      BR_BOOT_KIND="bridge"
      # The QEMU dbus scanout (== the live stream) is the kiosk X screen, forced to
      # 1024x768 by ~/.xinitrc (`xrandr --mode 1024x768`); FS-UAE is a 720x568 window
      # centred on a black root. Canvas == scanout => the tap is a 1:1 copy and the
      # clip matches the live stream dimensions exactly.
      BR_CANVAS_W=1024; BR_CANVAS_H=768; BR_FPS=30
      # -audiodev dbus,id=snd0,out.frequency=48000,out.channels=2,out.format=s16
      # -device AC97 ; FS-UAE --audio_frequency=48000 (Paula->ALSA->AC97).
      BR_HAS_AUDIO=1; BR_AUDIO_RATE=48000; BR_AUDIO_CH=2
      BR_HOSTFWD_ORIG=5818; BR_HOSTFWD_CLONE=6818        # live hostfwd :5818-:22 -> clone :6818
      BR_DISKS="overlay.qcow2"                          # thin overlay on shared read-only base
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=75000; BR_MAX_MS=120000  # ~60-75s to Workbench 1.3
      BR_REF_PNG=""; BR_REF_CROP=""                     # no Tier-2 confirm yet (pure fixed timer)
      BR_EMU_SSH_PORT=6818; BR_EMU_SSH_KEY="/data/vms/bridge/bridge_key"  # root@127.0.0.1
      # Fresh NVMe rebuilds carry the plain getty/X launcher rather than the
      # optional per-visit supervisor. Stop the login session before capture,
      # then start it to launch a genuinely fresh FS-UAE process.
      BR_EMU_PREP_CMD="systemctl stop getty@tty1; pkill -u bridge fs-uae 2>/dev/null || true"
      BR_EMU_BOOT_CMD="systemctl start getty@tty1"
      ;;                                                 # cold-relaunch from a fresh Workbench ADF
    alpine)  # Alpine 3.24 LiveCD -> root tty; scratch IDE qcow2 holds vmstate.
      BR_CANVAS_W=1280; BR_CANVAS_H=800; BR_FPS=30
      BR_HAS_AUDIO=1; BR_DISKS="state.qcow2"
      BR_PORT_REWRITES=("5881:6881")
      BR_BOOT_DRIVER="alpine-record-driver.sh"
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=5000; BR_MAX_MS=30000
      ;;
    tinycore)  # TinyCore 15 LiveCD -> FLWM/wbar; scratch virtio qcow2 holds vmstate.
      BR_CANVAS_W=1024; BR_CANVAS_H=768; BR_FPS=30
      BR_HAS_AUDIO=1; BR_DISKS="state.qcow2"
      BR_PORT_REWRITES=("5882:6882")
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=35000; BR_MAX_MS=90000
      ;;
    toaruos)  # remastered deterministic ISO is the golden; no snapshottable disk.
      BR_BOOT_KIND="restart"
      BR_CANVAS_W=1920; BR_CANVAS_H=1080; BR_FPS=30
      BR_HAS_AUDIO=1
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=45000; BR_MAX_MS=120000
      ;;
    amigaos)  # AROS pc-i386 LiveCD; scratch IDE qcow2 holds the new cold-boot golden.
      BR_CANVAS_W=1024; BR_CANVAS_H=768; BR_FPS=30
      BR_HAS_AUDIO=1; BR_DISKS="golden-scratch.qcow2"
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=65000; BR_MAX_MS=150000
      ;;
    helenos)  # HelenOS 0.14.1 LiveCD -> compositor; scratch IDE vmstate store.
      BR_CANVAS_W=1024; BR_CANVAS_H=768; BR_FPS=30
      BR_HAS_AUDIO=1; BR_DISKS="golden.qcow2"
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=60000; BR_MAX_MS=150000
      ;;
    kolibrios)  # KolibriOS LiveCD -> desktop; scratch virtio vmstate store.
      BR_CANVAS_W=1024; BR_CANVAS_H=768; BR_FPS=30
      BR_HAS_AUDIO=1; BR_DISKS="state.qcow2"
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=20000; BR_MAX_MS=60000
      ;;
    ninefront)  # disk boot -> rio; external golden disk is always cloned first.
      BR_CANVAS_W=1920; BR_CANVAS_H=1080; BR_FPS=30
      BR_HAS_AUDIO=1
      BR_HOSTFWD_ORIG=57793; BR_HOSTFWD_CLONE=58793
      BR_EXTERNAL_DISKS=("/data/gallery-guests/9front/9front-11554.amd64.qcow2|ninefront.qcow2")
      BR_GOLDEN_DISK="ninefront.qcow2"
      BR_BOOT_DRIVER="ninefront-record-driver.sh"
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=3000; BR_MAX_MS=120000
      ;;
    android)  # Android-x86 disk boot; terminal fixture settings persist on disk.
      BR_CANVAS_W=1024; BR_CANVAS_H=768; BR_FPS=30
      BR_HAS_AUDIO=1
      BR_EXTERNAL_DISKS=("/data/gallery-guests/Android/android.qcow2|android.qcow2")
      BR_GOLDEN_DISK="android.qcow2"
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=90000; BR_MAX_MS=180000
      ;;
    redstar2)  # Air-gapped Red Star 2 disk -> KDM auto-login -> KDE desktop.
      BR_BOOT_KIND="vmstate"
      BR_CANVAS_W=1024; BR_CANVAS_H=768; BR_FPS=30
      BR_HAS_AUDIO=0
      BR_EXTERNAL_DISKS=("/data/gallery-guests/RedStar2/redstar2.qcow2|redstar2.qcow2")
      BR_GOLDEN_DISK="redstar2.qcow2"
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=60000; BR_MAX_MS=120000
      ;;
    redstar3)  # Air-gapped Red Star 3 disk -> KDM auto-login -> KDE desktop.
      BR_BOOT_KIND="vmstate"
      BR_CANVAS_W=1024; BR_CANVAS_H=768; BR_FPS=30
      BR_HAS_AUDIO=0
      BR_EXTERNAL_DISKS=("/data/gallery-guests/RedStar3/redstar3.qcow2|redstar3.qcow2")
      BR_GOLDEN_DISK="redstar3.qcow2"
      BR_BOOT_DRIVER="redstar3-record-driver.sh"
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=45000; BR_MAX_MS=90000
      ;;
    win311)  # DOS 6.22 -> WfW 3.11 -> auto-opened Notepad, two-disk vmstate.
      BR_CANVAS_W=640; BR_CANVAS_H=480; BR_FPS=30
      BR_HAS_AUDIO=1; BR_DISKS="win311-golden.qcow2 games-golden.qcow2"
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=40000; BR_MAX_MS=90000
      ;;
    freedos)  # FreeDOS 1.3 FDAUTO.BAT -> deterministic retro-games menu.
      BR_CANVAS_W=720; BR_CANVAS_H=400; BR_FPS=30
      BR_HAS_AUDIO=1
      BR_EXTERNAL_DISKS=("/data/gallery-guests/FreeDOS/freedos.qcow2|freedos.qcow2")
      BR_GOLDEN_DISK="freedos.qcow2"
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=12000; BR_MAX_MS=60000
      ;;
    msdoswin1)  # DOS AUTOEXEC.BAT -> Windows 1.01 MS-DOS Executive.
      BR_CANVAS_W=640; BR_CANVAS_H=350; BR_FPS=30
      BR_HAS_AUDIO=1
      BR_EXTERNAL_DISKS=("/data/gallery-guests/MSDOSWin1/msdos-win1.qcow2|msdos-win1.qcow2")
      BR_GOLDEN_DISK="msdos-win1.qcow2"
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=20000; BR_MAX_MS=60000
      ;;
    qnx)  # QNX 6.5 LiveCD requires a fully automated F2/display/login driver.
      BR_CANVAS_W=800; BR_CANVAS_H=600; BR_FPS=30
      BR_HAS_AUDIO=1; BR_DISKS="golden.qcow2"
      BR_PORT_REWRITES=("7112:17112")
      BR_BOOT_DRIVER="qnx-record-driver.sh"
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=10000; BR_MAX_MS=60000
      ;;
    sailfishos)  # ephemeral -snapshot disk; current image cold-boots without a vmstate reset.
      BR_BOOT_KIND="restart"
      BR_CANVAS_W=720; BR_CANVAS_H=400; BR_FPS=30
      BR_HAS_AUDIO=0
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=180000; BR_MAX_MS=240000
      ;;
    templeos)  # ISO/RAM guest; automate the two first-boot questions, then savevm.
      BR_CANVAS_W=640; BR_CANVAS_H=480; BR_FPS=30
      BR_HAS_AUDIO=0; BR_DISKS="state.qcow2"
      BR_BOOT_DRIVER="templeos-record-driver.sh"
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=15000; BR_MAX_MS=60000
      ;;
    serenityos)  # non-migratable NVMe: fresh overlay over read-only raw golden.
      BR_BOOT_KIND="restart"
      BR_CANVAS_W=1024; BR_CANVAS_H=768; BR_FPS=30
      BR_HAS_AUDIO=1
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=75000; BR_MAX_MS=150000
      ;;
    postmarketos)  # UEFI portrait disk + writable qcow2 varstore; both are cloned.
      BR_CANVAS_W=720; BR_CANVAS_H=1440; BR_FPS=30
      BR_HAS_AUDIO=1; BR_DISKS="OVMF_VARS.qcow2"
      BR_EXTERNAL_DISKS=("/data/gallery-guests/postmarketOS/pmos-phosh.qcow2|pmos-phosh.qcow2")
      BR_GOLDEN_DISK="pmos-phosh.qcow2"
      BR_BOOT_DRIVER="postmarketos-record-driver.sh"
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=30000; BR_MAX_MS=120000
      ;;
    c64)  # bridge kiosk -> VICE x64sc -> C64 GEOS 2.0.
      BR_BOOT_KIND="bridge"
      BR_CANVAS_W=1024; BR_CANVAS_H=768; BR_FPS=30
      BR_HAS_AUDIO=1; BR_AUDIO_RATE=48000; BR_AUDIO_CH=2
      BR_HOSTFWD_ORIG=5814; BR_HOSTFWD_CLONE=6814
      BR_DISKS="overlay.qcow2"
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=100000; BR_MAX_MS=150000
      BR_EMU_SSH_PORT=6814; BR_EMU_SSH_KEY="/data/vms/bridge/bridge_key"
      BR_EMU_PREP_CMD="systemctl stop getty@tty1; pkill -u bridge x64sc 2>/dev/null || true"
      BR_EMU_BOOT_CMD="systemctl start getty@tty1"
      ;;
    atarist)  # bridge kiosk -> Hatari -> EmuTOS GEM.
      BR_BOOT_KIND="bridge"
      BR_CANVAS_W=1024; BR_CANVAS_H=768; BR_FPS=30
      BR_HAS_AUDIO=1; BR_AUDIO_RATE=48000; BR_AUDIO_CH=2
      BR_HOSTFWD_ORIG=5816; BR_HOSTFWD_CLONE=6816
      BR_DISKS="overlay.qcow2"
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=50000; BR_MAX_MS=90000
      BR_EMU_SSH_PORT=6816; BR_EMU_SSH_KEY="/data/vms/bridge/bridge_key"
      BR_EMU_PREP_CMD="systemctl stop getty@tty1; pkill -u bridge hatari 2>/dev/null || true"
      BR_EMU_BOOT_CMD="systemctl start getty@tty1"
      ;;
    apple2)  # bridge kiosk -> LinApple -> Apple //e GEOS.
      BR_BOOT_KIND="bridge"
      BR_CANVAS_W=1024; BR_CANVAS_H=768; BR_FPS=30
      BR_HAS_AUDIO=1; BR_AUDIO_RATE=48000; BR_AUDIO_CH=2
      BR_HOSTFWD_ORIG=5817; BR_HOSTFWD_CLONE=6817
      BR_DISKS="overlay.qcow2"
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=60000; BR_MAX_MS=120000
      BR_EMU_SSH_PORT=6817; BR_EMU_SSH_KEY="/data/vms/bridge/bridge_key"
      BR_EMU_PREP_CMD="systemctl stop pointer-watchdog.service getty@tty1; pkill -u bridge linapple 2>/dev/null || true"
      BR_EMU_BOOT_CMD="systemctl start getty@tty1; systemctl start pointer-watchdog.service"
      ;;
    vic20)  # bridge kiosk -> VICE xvic -> VIC-20 CBM BASIC V2. Same shape as the
      # c64 arm (same emulator, same overlay-on-frozen-base layout); the ROM comes
      # up in seconds, so the Tier-3 hold is short.
      BR_BOOT_KIND="bridge"
      BR_CANVAS_W=1024; BR_CANVAS_H=768; BR_FPS=30
      BR_HAS_AUDIO=1; BR_AUDIO_RATE=48000; BR_AUDIO_CH=2
      BR_HOSTFWD_ORIG=5821; BR_HOSTFWD_CLONE=6821
      BR_DISKS="overlay.qcow2"
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=45000; BR_MAX_MS=90000
      BR_EMU_SSH_PORT=6821; BR_EMU_SSH_KEY="/data/vms/bridge/bridge_key"
      BR_EMU_PREP_CMD="systemctl stop getty@tty1; pkill -u bridge xvic 2>/dev/null || true"
      BR_EMU_BOOT_CMD="systemctl start getty@tty1"
      ;;
    win95)  # reference vmstate/loadvm adopter (iconic splash). ALL fields confirmed
      # 2026-07-13 on a /data/vms/soltest CLONE against the LIVE launcher
      # /data/vms/streamhost/tiles/win95/qemu-streamhost.sh (machine pc,acpi=off /
      # cpu pentium,-apic / -vga std / sb16 dbus audio / pcnet user-net / IDE golden).
      BR_BOOT_KIND="vmstate"
      # 640x480 std-VGA: the live golden's framebuffer is exactly 640x480 (final.ppm
      # = 921600 B = 640*480*3; screendumps confirm). SH_FPS=30 in tile.env -> 30.
      BR_CANVAS_W=640; BR_CANVAS_H=480; BR_FPS=30
      BR_HAS_AUDIO=1; BR_AUDIO_RATE=48000; BR_AUDIO_CH=2   # sb16 dbus 48000/2/s16 -> Win95 ta-da
      BR_HOSTFWD_ORIG=57791; BR_HOSTFWD_CLONE=58791        # live -netdev hostfwd :57791-:7777
      BR_DISKS="win95-golden.qcow2"
      # DETECT: Tier-1 framebuffer-stability FALSE-SETTLES on Win95 cold boot — after
      # logon the teal desktop background paints and stays byte-static for >3 s while
      # Explorer is still loading the shell (taskbar/icons) and WIN.INI run=notepad has
      # not yet launched Notepad. Tier-1 baked a BLANK TEAL golden (verified on the
      # clone: poster == bare teal, +26 s). Use Tier-2 reference-region instead: match a
      # crop of the START BUTTON (present ONLY once the shell is fully up) against a
      # settled-desktop reference PNG. Immune to boot-time variance. The taskbar clock is
      # HIDDEN in the golden (Taskbar Properties -> Show Clock OFF, persists on disk), so
      # the settled desktop is genuinely static (30 s byte-identical screendumps observed)
      # and the caret blink is quieted (NOBLINK.reg CursorBlinkRate) — no live animation.
      # BR_REF_PNG lives beside the golden in the tile dir (for the clone proof it is the
      # settled-desktop screendump captured during zero-input prep; for a live bake, drop
      # the golden fixture screendump there under the same name).
      BR_DETECT_TIER=2; BR_REF_MATCH_K=3; BR_MAX_MS=120000
      BR_REF_PNG="${BOOTREC_TILES_ROOT:-/data/vms/streamhost/tiles}/win95/boot-ref-desktop.png"
      BR_REF_CROP="crop=56:18:2:458"   # 'Start' button, bottom-left; absent during boot/teal
      ;;
    winxp)  # Windows XP Pro SP3, vmstate/loadvm. Fields confirmed 2026-07-13 on a
      # /data/vms/soltest CLONE against the LIVE launcher
      # /data/vms/streamhost/tiles/winxp/qemu-streamhost.sh (machine pc / cpu host /
      # -m 768 -smp 1 / -vga std / dbus display + AC97 dbus audio 48000/2/s16 /
      # usb-tablet abs pointer / rtl8139 user-net NO hostfwd / IDE golden + retro-software
      # cdrom, boot order=c). Administrator AutoAdminLogon (DefaultPassword baked, LogonType=0
      # so NO Welcome-screen user pick) -> cold boot reaches the desktop with ZERO input.
      BR_BOOT_KIND="vmstate"
      # 1024x768 std-VGA: GOLDEN_RES=1024x768 (golden.env) and the live golden framebuffer
      # is 1024x768 (boot_golden.png). tile.env SH_FPS=30.
      BR_CANVAS_W=1024; BR_CANVAS_H=768; BR_FPS=30
      # AC97 dbus 48000/2/s16 -> the iconic "Windows XP Startup.wav" chime. The Sounds scheme
      # (HKCU AppEvents .current) maps SystemStart + WindowsLogon to the XP startup/logon wavs;
      # both fire under AutoAdminLogon, so the boot clip HAS AUDIO (a real settle-time chime).
      BR_HAS_AUDIO=1; BR_AUDIO_RATE=48000; BR_AUDIO_CH=2
      # winxp launcher has NO -netdev hostfwd (plain user-net) -> nothing to bump.
      BR_HOSTFWD_ORIG=""; BR_HOSTFWD_CLONE=""
      BR_DISKS="winxp-golden.qcow2"
      # DETECT: Tier-1 framebuffer-stability FALSE-SETTLES on XP cold boot — the Bliss
      # wallpaper paints and stays byte-static for >3 s while Explorer is still drawing the
      # taskbar/tray/icons (same failure mode as win95's teal desktop), and the XP taskbar
      # keeps animating (tray/Start hover glints). Use Tier-2 reference-region on the green
      # START BUTTON (bottom-left, present ONLY once the shell is fully up) vs a settled-
      # desktop reference PNG. Immune to boot-time variance; SSIM ~0 during boot/wallpaper,
      # ~1.0 once the Start button is drawn. The golden quiets idle animation (clock hidden,
      # caret steady, Security Center + Auto-Update disabled -> no balloons, screensaver/DPMS
      # off) so the settled clean Bliss desktop is byte-static and detection is deterministic.
      BR_DETECT_TIER=2; BR_REF_MATCH_K=3; BR_MAX_MS=180000
      BR_REF_PNG="${BOOTREC_TILES_ROOT:-/data/vms/streamhost/tiles}/winxp/boot-ref-desktop.png"
      BR_REF_CROP="crop=98:26:0:742"   # green 'start' button, bottom-left; absent during boot/wallpaper
      ;;
    win98se)  # Windows 98 SE, vmstate/loadvm, win95-like. Fields confirmed 2026-07-14 on a
      # /data/vms/soltest CLONE against the LIVE launcher
      # /data/vms/streamhost/tiles/win98se/qemu-streamhost.sh (machine pc,acpi=on /
      # cpu pentium3 / -m 384 / -vga std / dbus display + SB16 dbus audio 48000/2/s16 /
      # usb-tablet abs pointer / pcnet user-net NO hostfwd / TWO IDE disks C:+D:).
      #
      # The live launcher references its disks by ABSOLUTE paths OUTSIDE the tile dir
      # (/data/gallery-guests/Win98SE/{win98se-kvm,win98se-games}.qcow2) and BOTH carry
      # the 'golden' vmstate snapshot (it spans C:+D:), so BOTH are part of the device set
      # and BOTH must be present. To record, stage a normalised src tile dir under
      # /data/vms/soltest whose launcher references BOTH disks INSIDE it, and run with
      # BOOTREC_TILES_ROOT pointing at that root (record-boot's sed redirects every path to
      # the clone). See scripts/coldboot/win98se-zero-input-prep.md.
      BR_BOOT_KIND="vmstate"
      # 640x480 std-VGA: the live golden framebuffer is 640x480 (screendump P6 header +
      # boot.json confirm). SH_FPS=30 in tile.env -> 30.
      BR_CANVAS_W=640; BR_CANVAS_H=480; BR_FPS=30
      # SB16 dbus 48000/2/s16 -> the "Start Windows" (Windows98) startup chime. The Sounds
      # scheme (HKCU AppEvents\Schemes\Apps\.Default\SystemStart\.Current) maps the startup
      # wav; it fires when the shell loads under the zero-input autologon, so the boot clip
      # HAS AUDIO (a real settle-time chime). NB the wav MUST be assigned in the golden
      # (Control Panel -> Sounds) — a fresh Win98SE install leaves "Start Windows" = (None).
      BR_HAS_AUDIO=1; BR_AUDIO_RATE=48000; BR_AUDIO_CH=2
      BR_HOSTFWD_ORIG=""; BR_HOSTFWD_CLONE=""     # live -netdev user has NO hostfwd
      BR_DISKS="win98se-kvm.qcow2 win98se-games.qcow2"   # BOTH disks carry the golden vmstate
      # DETECT: Tier-1 framebuffer-stability false-settles on the teal PRE-SHELL phase (the
      # win95 lesson); bare Tier-2 Start-button fires too EARLY (~+28s) — the Start button
      # paints while the cursor is still a busy hourglass until ~+45s, so the poster lands on
      # the busy-cursor frame. The desktop reaches full idle (arrow cursor) + byte-static by
      # ~+45s. Use Tier-3 fixed 50s (lands on the fully-idle desktop) + a Tier-2 Start-button
      # confirm (crop present ONLY once the shell is up) against the settled-desktop ref PNG.
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=50000; BR_REF_MATCH_K=3; BR_MAX_MS=150000
      BR_REF_PNG="${BOOTREC_TILES_ROOT:-/data/vms/streamhost/tiles}/win98se/boot-ref-desktop.png"
      BR_REF_CROP="crop=56:18:2:458"   # Win98 'Start' button, bottom-left; absent during boot/teal
      ;;
    haiku)  # static desktop (Haiku R1/beta5). ALL fields confirmed 2026-07-13 against
      # the LIVE launcher /data/vms/streamhost/tiles/haiku/qemu-streamhost.sh
      # (machine pc / cpu host / -device VGA edid xres=1280,yres=720 / intel-hda+hda-output
      # dbus audio / e1000 user-net hostfwd :5807-:22 / single IDE haiku-persist.qcow2,
      # internal 'golden' snapshot) and a /data/vms/soltest CLONE. Live tile untouched.
      BR_BOOT_KIND="vmstate"
      # 1280x720: the live golden framebuffer is exactly 1280x720 — desk.ppm/wake.ppm/
      # aud_haiku.ppm are each 2764816 B = 1280*720*3 + PPM header. The VGA device pins
      # the mode via edid xres=1280,yres=720; the tap normalises SeaBIOS/boot modes onto it.
      BR_CANVAS_W=1280; BR_CANVAS_H=720; BR_FPS=30   # tile.env SH_FPS=60; 30 is plenty for a clip
      BR_HAS_AUDIO=1; BR_AUDIO_RATE=48000; BR_AUDIO_CH=2   # intel-hda dbus 48000/2/s16 -> Haiku boot chime
      BR_HOSTFWD_ORIG=5807; BR_HOSTFWD_CLONE=6807          # live -netdev hostfwd :5807-:22 (ssh)
      BR_DISKS="haiku-persist.qcow2"
      # DETECT: Tier-1 framebuffer-stability FALSE-SETTLES on Haiku cold boot and must NOT be
      # used. Measured on the clone: the Haiku boot SPLASH (black screen, HAIKU logo, a row of
      # boot-stage icons that light up ONE BY ONE) advances with a per-frame cf of only
      # ~0.0008-0.0014 — BELOW the 0.005 Tier-1 threshold — so the detector treats the still-
      # animating splash as "stable" and settles at +6.7 s, baking the BOOT SPLASH, not the
      # desktop (poster == splash; verified). The real timeline (2 s screendumps): splash ~t6s
      # -> screen clears to BLACK ~t8-10s -> desktop paints -> byte-static desktop from ~t14s
      # (md5-identical t14s..t44s: clock hidden + ProcessController removed => no idle animation).
      #
      # Use Tier-2 reference-region instead: SSIM a crop of the TOP-RIGHT DESKBAR (leaf logo +
      # header) against a settled-desktop reference. That region is PURE BLACK during the splash
      # (region-SSIM ~1e-6 vs the reference) and only paints once the desktop is up (region-SSIM
      # 1.000000, static), so it cannot match the splash. K=3 @1 s poll => 3 s of confirmed
      # desktop. (Clone proof: settle on the real desktop; poster == loadvm-golden md5-identical.)
      #
      # BR_REF_PNG: for a LIVE bake, drop the golden fixture screendump at the tile-dir path
      # below (matches the win95 convention). For a clone proof WITHOUT touching the live tile
      # dir, export HAIKU_BOOT_REF=<staged settled-desktop screendump> and it wins.
      BR_DETECT_TIER=2; BR_REF_MATCH_K=3; BR_MAX_MS=120000
      BR_REF_PNG="${HAIKU_BOOT_REF:-${BOOTREC_TILES_ROOT:-/data/vms/streamhost/tiles}/haiku/boot-ref-desktop.png}"
      BR_REF_CROP="crop=135:60:1145:0"   # top-right Deskbar (leaf+header); black during splash, static on desktop
      ;;
    os2warp)  # IBM OS/2 Warp 4 GA (Merlin) WPS desktop. ALL fields confirmed 2026-07-13
      # on a /data/vms/soltest CLONE against the LIVE launcher
      # /data/vms/streamhost/tiles/os2warp/qemu-streamhost.sh (machine pc,acpi=off,usb=off /
      # cpu pentium / -vga cirrus / sb16 dbus audio / pcnet user-net (NO hostfwd) / a
      # device-set-safe serial chardev on serial0 carrying the in-guest WARPD.EXE pointer
      # agent / single IDE golden os2.qcow2). vmstate loadvm-golden tile.
      BR_BOOT_KIND="vmstate"
      # 640x480 cirrus: every golden screendump is exactly 640x480 (boot.png/g_restored/
      # cert_golden/idle all 640x480; live loadvm-golden screendump confirmed 640x480).
      # tile.env SH_FPS=60 live, but the boot clip is fine at 30 (the last-frame invariant
      # is about PIXELS, not fps) -> keep 30 for a compact clip.
      BR_CANVAS_W=640; BR_CANVAS_H=480; BR_FPS=30
      BR_HAS_AUDIO=1; BR_AUDIO_RATE=48000; BR_AUDIO_CH=2   # sb16 dbus 48000/2/s16
      # os2warp's -netdev user,id=n0 has NO hostfwd and the tile drives the pointer over a
      # serial chardev (not a host TCP port) -> leave hostfwd empty; the clone's qmp.sock/
      # pidfile/serial.sock are namespaced under the clone dir, nothing to collide with live.
      BR_HOSTFWD_ORIG=""; BR_HOSTFWD_CLONE=""
      # !! STAGING REQUIRED (like win98se) !! The launcher references its disk by the ABSOLUTE
      # path DISK=/data/gallery-guests/OS2Warp/os2.qcow2 (NOT $TILE_DIR), so record-boot.sh's
      # $TILE_DIR->clone sed does NOT redirect it; a naive run would leave the clone (and
      # savevm golden!) pointing at the LIVE disk. Run with BOOTREC_TILES_ROOT pointed at a
      # soltest staging tiles root holding a COPY of os2.qcow2 + a launcher whose D=<staging>
      # and DISK=$D/os2.qcow2 (tile-dir-relative) so the sed redirects both into the clone.
      # See os2warp-zero-input-prep.md.
      BR_DISKS="os2.qcow2"
      # DETECT: Tier-2 reference-region — Tier-1 framebuffer-stability FALSE-SETTLES on the
      # os2warp cold boot. STARTUP.CMD runs `start C:\WARPD.EXE` then prints "Setting up the
      # gallery desktop, please wait..." in a VIO window that sits BYTE-STATIC for ~45 s
      # (measured: full-frame SSIM(t45,t90)=0.9994 => cf=0.0006 < 0.005) before the WPS
      # finishes building the gallery desktop and the VIO window auto-closes (~t120). Tier-1
      # would bake that "please wait" frame (the win95 teal trap). The settled desktop also
      # keeps a live WarpCenter clock + free-mem counter ticking in the top ~20px bar, so
      # full-frame stability never truly settles either. Match a crop of the LEFT ICON COLUMN
      # (Assistance Center/Connections/Programs — painted ONLY once the gallery desktop is
      # fully built; black during 'please wait'; no clock, no parked pointer) against the
      # settled-desktop reference PNG. Validated on the clone: SSIM(please-wait,ref|crop)=
      # 0.0001, SSIM(settled,ref|crop)=1.000 — clean discrimination.
      BR_DETECT_TIER=2; BR_REF_MATCH_K=3; BR_MAX_MS=180000
      BR_REF_PNG="${BOOTREC_TILES_ROOT:-/data/vms/streamhost/tiles}/os2warp/boot-ref-desktop.png"
      BR_REF_CROP="crop=110:250:10:105"   # left icon column; absent during boot/'please wait'
      ;;
    reactos)  # ReactOS 0.4.14 LiveCD tile. Fields confirmed 2026-07-13 against the LIVE
      # launcher /data/vms/streamhost/tiles/reactos/qemu-streamhost.sh, tile.env, and
      # /data/reactos-golden/golden-manifest.json (base.ppm = P6 800 600 => 800x600).
      #
      # *** THREE reactos-SPECIFIC FACTS that BREAK the standard record-boot.sh flow ***
      #  (1) DISKLESS LiveCD. The launcher boots the ISO (-cdrom ReactOS.iso -boot d) and
      #      does NOT boot the qcow2. The qcow2 is ONLY a `savevm golden` store. There is
      #      no writable OS disk, so there is NOTHING on the qcow2 a cold boot reads =>
      #      the per-OS zero-input prep (§3.2, which bakes into the boot disk) has NO
      #      surface here. The LiveCD GUI shows a Language dialog then a "Run ReactOS Live
      #      CD" dialog, BOTH modal + click-gated, with no timeout => a cold boot CANNOT
      #      reach the desktop with zero input. (Curated golden was made by clicking both.)
      #  (2) EXTERNAL GOLDEN STORE. The qcow2 is /data/reactos-golden/reactos-golden.qcow2,
      #      NOT under $TILE_DIR. record-boot.sh copies BR_DISKS from "$TILE_DIR/$d" and its
      #      sed only rewrites "$TILE_DIR" -> clone dir; it does NOT rewrite the launcher's
      #      hard-coded GDIR=/data/reactos-golden. So an automated run would leave the clone
      #      pointing at (and savevm-writing) the LIVE golden. => record-boot.sh needs an
      #      external-golden-store override before it can safely record reactos.
      #  (3) NO -loadvm IN THE LAUNCHER. The launcher already cold-boots (reset is a LIVE
      #      QMP `loadvm golden` by the daemon), so there is no `LOADVM="-loadvm golden"`
      #      line to neutralise; the vmstate neutralise-sed WARNS (harmless here).
      # Until (1)+(2) are resolved this tile is NOT auto-recordable; see the record report.
      BR_BOOT_KIND="vmstate"
      BR_CANVAS_W=800; BR_CANVAS_H=600; BR_FPS=30      # base.ppm 800x600; SH_FPS=60 live, 30 for the clip
      BR_HAS_AUDIO=1; BR_AUDIO_RATE=48000; BR_AUDIO_CH=2   # -audiodev dbus + -device AC97 (48000/2/s16); LiveCD boot is silent (no chime expected)
      BR_HOSTFWD_ORIG=""; BR_HOSTFWD_CLONE=""          # launcher has NO -netdev/-net => no hostfwd to bump
      BR_DISKS=""                                      # golden is EXTERNAL (see fact 2); NOT a tile-dir disk
      # Static desktop once reached => Tier-1 stability. The clean-boot desktop shows a
      # LIVE taskbar clock (the curated golden HIDES it) that ticks once/min; the 3s
      # settle window lands between ticks, but if Tier-1 fails to settle, switch to Tier-2
      # with a Start-button crop against a settled-desktop reference PNG (win95 pattern).
      BR_DETECT_TIER=1; BR_CF_THRESHOLD="0.005"; BR_SETTLE_MS=3000; BR_MAX_MS=150000
      ;;
    solariscde)  # Solaris 10 1/13 CDE, vmstate/loadvm. ALL fields confirmed 2026-07-13 on a
      # /data/vms/soltest CLONE against the LIVE launcher
      # /data/vms/streamhost/tiles/solariscde/qemu-streamhost.sh (machine pc / cpu Nehalem /
      # -m 3072 -smp 2 / -vga std / dbus display + AC97 dbus audio / usb-tablet abs pointer /
      # e1000 user-net hostfwd :57790-10.0.2.15:7777 / IDE golden). Login root/solaris.
      BR_BOOT_KIND="vmstate"
      # 1920x1200 std-VGA: the live golden framebuffer is 1920x1200 (golden.json +
      # live screendump P6 header confirm; golden-fixture.png = 1920x1200). The delivered
      # clip is paced at 30 fps (tile.env SH_FPS=60, but 30 is plenty for a boot clip and
      # halves the 9.2 MB/frame BGRA fifo throughput — keeps the box lean during capture).
      BR_CANVAS_W=1920; BR_CANVAS_H=1200; BR_FPS=30
      # crf 14 (not the default 18): at 1920x1200 the noisy CDE Corrugated backdrop makes crf18
      # leave enough H.264 residual that the boot.mp4 LAST frame vs poster luma-SSIM lands at
      # 0.998951 (just under the 0.999 gate). crf 14 raises it above 0.999 (gate-1 poster==golden
      # is md5-identical regardless). Larger file, but staging-only; SPA delivery re-encodes anyway.
      BR_CRF=14
      # Solaris CDE has NO boot/login chime (AC97 present but the login never plays audio);
      # record video-only (no audio fifo) — matches the silent retro-desktop reality (spec §2.5).
      BR_HAS_AUDIO=0
      # 58790 is occupied by an unrelated preserved lab experiment on the rebuilt
      # host; keep the recorder isolated on a distinct unused forward.
      BR_HOSTFWD_ORIG=57790; BR_HOSTFWD_CLONE=59790   # live -netdev hostfwd :57790-10.0.2.15:7777 (warpd)
      BR_DISKS="solariscde-golden.qcow2"
      # DETECT: Tier-1 framebuffer-stability is unusable — a cold Solaris boot paints the CDE
      # Corrugated backdrop + dtwm root LONG before the fixture dtterm appears (Tier-1 would
      # false-settle on the bare backdrop), and the front panel comes up a few seconds BEFORE
      # the dtterm, so a panel crop would also settle on a terminal-less desktop. Use Tier-2 on
      # the GOLDEN-FIXTURE-TERMINAL TITLE BAR: a crop of its maroon title band + white
      # "GOLDEN-FIXTURE-TERMINAL" text (fixed geometry +140+110), which appears ONLY when the
      # terminal — the LAST element of the settled fixture — is fully drawn. Immune to boot-time
      # variance; SSIM vs the grey backdrop during boot is far below the 0.985 gate, ~1.0 once up.
      # The golden fixture already froze all idle animation (front-panel Clock removed, perf-meter
      # frozen, screensaver/DPMS off, dtterm blinkRate 0) so the settled desktop is byte-static and
      # detection is deterministic. BR_REF_PNG is the clean settled-desktop screendump captured on
      # the clone during zero-input prep (measured maroon band y111-138: RGB ~178,77,122).
      BR_DETECT_TIER=2; BR_REF_MATCH_K=4; BR_MAX_MS=300000
      BR_REF_PNG="${BOOTREC_TILES_ROOT:-/data/vms/streamhost/tiles}/solariscde/boot-ref-desktop.png"
      # Terminal title bar (maroon band + title text), 1920x1200: crop 430x26 at x=350,y=112.
      BR_REF_CROP="crop=430:26:350:112"
      ;;
    win2000)  # Windows 2000 Pro SP4, vmstate. Fields confirmed 2026-07-14 on a
      # /data/vms/soltest CLONE against the LIVE launcher
      # /data/vms/streamhost/tiles/win2000/qemu-streamhost.sh (machine pc / cpu host /
      # -m 512 -smp 1 / -vga cirrus / dbus display + AC97 dbus audio / usb-tablet abs
      # pointer / rtl8139 user-net NO hostfwd / IDE golden). Administrator autologon.
      #
      # NOTE the live win2000 launcher's disk lives OUTSIDE the tile dir
      # (/data/gallery-guests/Win2000/win2k-pro.qcow2) and the launcher itself COLD-boots
      # (no -loadvm; the golden is jumped-to via QMP loadvm AFTER launch). To record with
      # this tooling, stage a normalised src tile dir under /data/vms/soltest whose
      # launcher references the disk INSIDE it (win2000-golden.qcow2), and run with
      # BOOTREC_TILES_ROOT pointing at that root (the record-boot sed then redirects every
      # path to the clone). See scripts/coldboot/win2000-zero-input-prep.md.
      BR_BOOT_KIND="vmstate"
      # The rebuilt NVMe golden presents a 640x480 cirrus framebuffer. Keep the boot
      # canvas identical to the live scanout so the handoff does not rescale.
      BR_CANVAS_W=640; BR_CANVAS_H=480; BR_FPS=30
      BR_CRF=18                       # flat cirrus desktop + white Notepad: crf18 last-frame SSIM >> 0.999
      # AC97 dbus 48000/2/s16 -> the Win2000 startup chime ("Windows Logon Sound.wav",
      # HKCU AppEvents\Schemes\Apps\.Default\SystemStart). The ichaud (Intel 82801AA AC97)
      # WDM driver is installed in the guest, so the logon sound plays on autologon.
      BR_HAS_AUDIO=1; BR_AUDIO_RATE=48000; BR_AUDIO_CH=2
      BR_HOSTFWD_ORIG=""; BR_HOSTFWD_CLONE=""          # live -netdev user has NO hostfwd
      BR_DISKS="win2000-golden.qcow2"
      # ZERO-INPUT: cold boot autologons (AutoAdminLogon=1, blank Administrator pw) to a
      # clean Explorer desktop; GoldenNotepad (HKLM Run) auto-opens focused (empty, solid
      # caret). The ONLY cold-boot blocker was the "Found New Hardware Wizard" for the
      # QEMU VM-Generation-ID ACPI device (HWID ACPI\QEMU0002, no Win2000 driver); it
      # re-prompted every boot because cancelling at the welcome page never sets a flag.
      # FIX (offline, both control sets): Enum\ACPI\QEMU0002\<inst> ConfigFlags=0x2
      # (CONFIGFLAG_FAILEDINSTALL) -> PnP stops re-launching the wizard (silent yellow-bang
      # in Device Manager only). Verified: cold boot now reaches the settled desktop with
      # ZERO input. See win2000-zero-input-prep.md.
      #
      # DETECT: the rebuilt golden is a clean desktop (no auto-opened Notepad), so use
      # the Start button as the shell-ready marker. The crop excludes the live clock.
      BR_DETECT_TIER=2; BR_REF_MATCH_K=3; BR_MAX_MS=120000
      BR_REF_PNG="${BOOTREC_TILES_ROOT:-/data/vms/streamhost/tiles}/win2000/boot-ref-desktop.png"
      BR_REF_CROP="crop=56:18:2:458"   # Start button; absent before Explorer is ready
      ;;
    irix)
      # NOT recorded by record-boot.sh — no QEMU/QMP/dbus to tap. The irix tile
      # is a MAME x11-runtime tile whose framebuffer lives in fb.shm; its boot
      # video comes from irix-record-boot.sh + irix-shm-tap.py (combined
      # record+rebake: the clip's final GOP and the instant-restore savestate
      # are captured in the same pause window, so the seam is exact by
      # construction). Video-only, canvas 1288x1024@30, bootKind relaunch.
      br_die "irix is recorded by irix-record-boot.sh (shm sampler), not record-boot.sh"
      ;;
    *)
      br_die "no bootrec config for tile '$t' — add a case arm in bootrec-tiles.conf"
      ;;
  esac
}
