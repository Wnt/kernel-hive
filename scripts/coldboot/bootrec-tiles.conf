  reactos) # ReactOS 0.4.14 LiveCD tile. Fields confirmed 2026-07-13 against the LIVE
    # launcher /data/vms/streamhost/stations/reactos/qemu-streamhost.sh, station.env, and
    # /data/reactos-golden/golden-manifest.json (base.ppm = P6 800 600 => 800x600).
    #
    # *** THREE reactos-SPECIFIC FACTS that BREAK the standard record-boot.sh flow ***
    #  (1) DISKLESS LiveCD. The launcher boots the ISO (-cdrom ReactOS.iso -boot d) and
    #      does NOT boot the qcow2. The qcow2 is ONLY a `savevm golden` store. There is
    #      no writable OS disk, so there is NOTHING on the qcow2 a cold boot reads =>
    #      the per-OS zero-input prep (§3.2, which bakes into the boot disk) has NO
    #      surface here. The LiveCD GUI shows a Language dialog then a "Run ReactOS Live
    #      CD" dialog, BOTH modal + click-gated, with no timeout => a cold boot CANNOT
    #      reach the desktop with zero input. (Curated golden was made by clicking both.)
    #  (2) EXTERNAL GOLDEN STORE. The qcow2 is /data/reactos-golden/reactos-golden.qcow2,
    #      NOT under $TILE_DIR. record-boot.sh copies BR_DISKS from "$TILE_DIR/$d" and its
    #      sed only rewrites "$TILE_DIR" -> clone dir; it does NOT rewrite the launcher's
    #      hard-coded GDIR=/data/reactos-golden. So an automated run would leave the clone
    #      pointing at (and savevm-writing) the LIVE golden. => record-boot.sh needs an
    #      external-golden-store override before it can safely record reactos.
    #  (3) NO -loadvm IN THE LAUNCHER. The launcher already cold-boots (reset is a LIVE
    #      QMP `loadvm golden` by the daemon), so there is no `LOADVM="-loadvm golden"`
    #      line to neutralise; the vmstate neutralise-sed WARNS (harmless here).
    # Until (1)+(2) are resolved this tile is NOT auto-recordable; see the record report.
    BR_BOOT_KIND="vmstate"
    BR_CANVAS_W=800
    BR_CANVAS_H=600
    BR_FPS=30 # base.ppm 800x600; SH_FPS=60 live, 30 for the clip
    BR_HAS_AUDIO=1
    BR_AUDIO_RATE=48000
    BR_AUDIO_CH=2 # -audiodev dbus + -device AC97 (48000/2/s16); LiveCD boot is silent (no chime expected)
    BR_HOSTFWD_ORIG=""
    BR_HOSTFWD_CLONE="" # launcher has NO -netdev/-net => no hostfwd to bump
    BR_DISKS=""         # golden is EXTERNAL (see fact 2); NOT a tile-dir disk
    # Static desktop once reached => Tier-1 stability. The clean-boot desktop shows a
    # LIVE taskbar clock (the curated golden HIDES it) that ticks once/min; the 3s
    # settle window lands between ticks, but if Tier-1 fails to settle, switch to Tier-2
    # with a Start-button crop against a settled-desktop reference PNG (win95 pattern).
    BR_DETECT_TIER=1
    BR_CF_THRESHOLD="0.005"
    BR_SETTLE_MS=3000
    BR_MAX_MS=150000
    ;;
  solaris) # Solaris 10 1/13 CDE, vmstate/loadvm. ALL fields confirmed 2026-07-13 on a
    # /data/vms/sandbox CLONE against the LIVE launcher
    # /data/vms/streamhost/stations/solaris/qemu-streamhost.sh (machine pc / cpu Nehalem /
    # -m 3072 -smp 2 / -vga std / dbus display + AC97 dbus audio / usb-tablet abs pointer /
    # e1000 user-net hostfwd :57790-10.0.2.15:7777 / IDE golden). Login root/solaris.
    BR_BOOT_KIND="vmstate"
    # 1920x1200 std-VGA: the live golden framebuffer is 1920x1200 (golden.json +
    # live screendump P6 header confirm; golden-fixture.png = 1920x1200). The delivered
    # clip is paced at 30 fps (station.env SH_FPS=60, but 30 is plenty for a boot clip and
    # halves the 9.2 MB/frame BGRA fifo throughput — keeps the box lean during capture).
    BR_CANVAS_W=1920
    BR_CANVAS_H=1200
    BR_FPS=30
    # crf 14 (not the default 18): at 1920x1200 the noisy CDE Corrugated backdrop makes crf18
    # leave enough H.264 residual that the boot.mp4 LAST frame vs poster luma-SSIM lands at
    # 0.998951 (just under the 0.999 gate). crf 14 raises it above 0.999 (gate-1 poster==golden
    # is md5-identical regardless). Larger file, but staging-only; SPA delivery re-encodes anyway.
    BR_CRF=14
    # Solaris CDE has NO boot/login chime (AC97 present but the login never plays audio);
    # record video-only (no audio fifo) — matches the silent retro-desktop reality (spec §2.5).
    BR_HAS_AUDIO=0
    # 58790 is occupied by an unrelated preserved lab experiment on the rebuilt
    # host; keep the recorder isolated on a distinct unused forward.
    BR_HOSTFWD_ORIG=57790
    BR_HOSTFWD_CLONE=59790 # live -netdev hostfwd :57790-10.0.2.15:7777 (warpd)
    BR_DISKS="solariscde-golden.qcow2"
    # DETECT: Tier-1 framebuffer-stability is unusable — a cold Solaris boot paints the CDE
    # Corrugated backdrop + dtwm root LONG before the fixture dtterm appears (Tier-1 would
    # false-settle on the bare backdrop), and the front panel comes up a few seconds BEFORE
    # the dtterm, so a panel crop would also settle on a terminal-less desktop. Use Tier-2 on
    # the GOLDEN-FIXTURE-TERMINAL TITLE BAR: a crop of its maroon title band + white
    # "GOLDEN-FIXTURE-TERMINAL" text (fixed geometry +140+110), which appears ONLY when the
    # terminal — the LAST element of the settled fixture — is fully drawn. Immune to boot-time
    # variance; SSIM vs the grey backdrop during boot is far below the 0.985 gate, ~1.0 once up.
    # The golden fixture already froze all idle animation (front-panel Clock removed, perf-meter
    # frozen, screensaver/DPMS off, dtterm blinkRate 0) so the settled desktop is byte-static and
    # detection is deterministic. BR_REF_PNG is the clean settled-desktop screendump captured on
    # the clone during zero-input prep (measured maroon band y111-138: RGB ~178,77,122).
    BR_DETECT_TIER=2
    BR_REF_MATCH_K=4
    BR_MAX_MS=300000
    BR_REF_PNG="${BOOTREC_TILES_ROOT:-/data/vms/streamhost/stations}/solaris/boot-ref-desktop.png"
    # Terminal title bar (maroon band + title text), 1920x1200: crop 430x26 at x=350,y=112.
    BR_REF_CROP="crop=430:26:350:112"
    ;;
  win2000) # Windows 2000 Pro SP4, vmstate. Fields confirmed 2026-07-14 on a
    # /data/vms/sandbox CLONE against the LIVE launcher
    # /data/vms/streamhost/stations/win2000/qemu-streamhost.sh (machine pc / cpu host /
    # -m 512 -smp 1 / -vga cirrus / dbus display + AC97 dbus audio / usb-tablet abs
    # pointer / rtl8139 user-net NO hostfwd / IDE golden). Administrator autologon.
    #
    # NOTE the live win2000 launcher's disk lives OUTSIDE the tile dir
    # (/data/gallery-guests/Win2000/win2k-pro.qcow2) and the launcher itself COLD-boots
    # (no -loadvm; the golden is jumped-to via QMP loadvm AFTER launch). To record with
    # this tooling, stage a normalised src tile dir under /data/vms/sandbox whose
    # launcher references the disk INSIDE it (win2000-golden.qcow2), and run with
    # BOOTREC_TILES_ROOT pointing at that root (the record-boot sed then redirects every
    # path to the clone). See scripts/coldboot/win2000-zero-input-prep.md.
    BR_BOOT_KIND="vmstate"
    # The rebuilt NVMe golden presents a 640x480 cirrus framebuffer. Keep the boot
    # canvas identical to the live scanout so the handoff does not rescale.
    BR_CANVAS_W=640
    BR_CANVAS_H=480
    BR_FPS=30
    BR_CRF=18 # flat cirrus desktop + white Notepad: crf18 last-frame SSIM >> 0.999
    # AC97 dbus 48000/2/s16 -> the Win2000 startup chime ("Windows Logon Sound.wav",
    # HKCU AppEvents\Schemes\Apps\.Default\SystemStart). The ichaud (Intel 82801AA AC97)
    # WDM driver is installed in the guest, so the logon sound plays on autologon.
    BR_HAS_AUDIO=1
    BR_AUDIO_RATE=48000
    BR_AUDIO_CH=2
    BR_HOSTFWD_ORIG=""
    BR_HOSTFWD_CLONE="" # live -netdev user has NO hostfwd
    BR_DISKS="win2000-golden.qcow2"
    # ZERO-INPUT: cold boot autologons (AutoAdminLogon=1, blank Administrator pw) to a
    # clean Explorer desktop; GoldenNotepad (HKLM Run) auto-opens focused (empty, solid
    # caret). The ONLY cold-boot blocker was the "Found New Hardware Wizard" for the
    # QEMU VM-Generation-ID ACPI device (HWID ACPI\QEMU0002, no Win2000 driver); it
    # re-prompted every boot because cancelling at the welcome page never sets a flag.
    # FIX (offline, both control sets): Enum\ACPI\QEMU0002\<inst> ConfigFlags=0x2
    # (CONFIGFLAG_FAILEDINSTALL) -> PnP stops re-launching the wizard (silent yellow-bang
    # in Device Manager only). Verified: cold boot now reaches the settled desktop with
    # ZERO input. See win2000-zero-input-prep.md.
    #
    # DETECT: the rebuilt golden is a clean desktop (no auto-opened Notepad), so use
    # the Start button as the shell-ready marker. The crop excludes the live clock.
    BR_DETECT_TIER=2
    BR_REF_MATCH_K=3
    BR_MAX_MS=120000
    BR_REF_PNG="${BOOTREC_TILES_ROOT:-/data/vms/streamhost/stations}/win2000/boot-ref-desktop.png"
    BR_REF_CROP="crop=56:18:2:458" # Start button; absent before Explorer is ready
    ;;
  nextstep) # bridge kiosk -> Previous 4.4 -> NeXTcube -> NeXTSTEP 3.3 Workspace.
    # Canvas is 1120x832, NOT the usual 1024x768: the kiosk adds a custom xrandr
    # mode so the X root is exactly the NeXT MegaPixel display and the picture is
    # pixel-exact. Declaring anything else letterboxes the clip differently from
    # the live tile.
    #
    # A cold boot is two machines in series — the Debian kiosk (~30 s) and then
    # the cube's own ROM POST, Mach kernel load and Workspace login, which took
    # about four minutes wall-clock in every observed run on this host. Hence the
    # long Tier-3 hold and the 420 s ceiling.
    #
    # ZERO-INPUT is genuine from the second boot of the disk image onwards:
    # NeXTSTEP's one-time Welcome panel is answered during the build, and the
    # machine then logs itself in as the user `me` with no password prompt.
    BR_BOOT_KIND="bridge"
    BR_CANVAS_W=1120
    BR_CANVAS_H=832
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_AUDIO_RATE=48000
    BR_AUDIO_CH=2
    BR_HOSTFWD_ORIG=5837
    BR_HOSTFWD_CLONE=6837
    BR_DISKS="overlay.qcow2"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=270000
    BR_MAX_MS=420000
    BR_EMU_SSH_PORT=6837
    BR_EMU_SSH_KEY="/data/vms/bridge/bridge_key"
    BR_EMU_PREP_CMD="systemctl stop getty@tty1; pkill -u bridge -x previous 2>/dev/null || true; pkill -u bridge -f nextstep-kiosk-frame 2>/dev/null || true"
    BR_EMU_BOOT_CMD="systemctl start getty@tty1"
    ;;
  irix)
    # NOT recorded by record-boot.sh — no QEMU/QMP/dbus to tap. The irix tile
    # is a MAME x11-runtime tile whose framebuffer lives in fb.shm; its boot
    # video comes from irix-record-boot.sh + irix-shm-tap.py (combined
    # record+rebake: the clip's final GOP and the instant-restore savestate
    # are captured in the same pause window, so the seam is exact by
    # construction). Video-only, canvas 1288x1024@30, bootKind relaunch.
    br_die "irix is recorded by irix-record-boot.sh (shm sampler), not record-boot.sh"
    ;;
  zx81) # bridge kiosk -> MAME 0.289 `zx81` (-bios 2nd, -ramsize 1K) -> the
    # machine's own power-on screen: an empty white field with one inverse-video
    # K in the bottom-left corner. A cold boot reaches exactly what the golden
    # holds -- the ZX81 asks for nothing on the way up -- so a clip hands off
    # without a seam. See zx81-zero-input-prep.md.
    BR_BOOT_KIND="bridge"
    BR_CANVAS_W=1024
    BR_CANVAS_H=768
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_AUDIO_RATE=48000
    BR_AUDIO_CH=2
    BR_HOSTFWD_ORIG=5831
    BR_HOSTFWD_CLONE=6831
    BR_DISKS="overlay.qcow2"
    # TIER 3 (fixed timer) ON PURPOSE. Tier 1's change-fraction detector cannot
    # be used here: this machine BLANKS ITS DISPLAY WHILE IT COMPUTES, so a
    # still, uniformly bright frame is an ordinary intermediate state and not
    # the fixture. The real predicate is geometric and lives in
    # streamhost/stations/zx81/zx81-frame.py (--assert idle).
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=45000
    BR_MAX_MS=90000
    BR_EMU_SSH_PORT=6831
    BR_EMU_SSH_KEY="/data/vms/bridge/bridge_key"
    BR_EMU_PREP_CMD="systemctl stop getty@tty1; pkill -u bridge zx81 2>/dev/null || true"
    BR_EMU_BOOT_CMD="systemctl start getty@tty1"
    ;;
  beos) # BeOS R5 Professional 5.0.3 (x86, TCG) -> 1024x768x16 blue desktop.
    # One writable disk holds both the volume and the vmstate. The fixture is a
    # dead-still desktop (Deskbar clock ticks once a minute; the Terminal caret
    # blinks, so compare at a fixed machine instant per ADD-NEW-OS-PLAYBOOK §5.1).
    # No audio device (both QEMU AC97 and ES1370 stall R5's media_server).
    BR_BOOT_KIND="vmstate"
    BR_CANVAS_W=1024
    BR_CANVAS_H=768
    BR_FPS=30
    BR_HAS_AUDIO=0
    BR_DISKS="beos-golden.qcow2"
    # TIER 1: splash -> desktop colour fill -> Tracker/Deskbar/Terminal, then still.
    # Generous MAX: TCG boot reaches the desktop in ~150 s on a loaded box.
    BR_DETECT_TIER=1
    BR_CF_THRESHOLD="0.005"
    BR_SETTLE_MS=4000
    BR_MAX_MS=300000
    ;;
  macos753) # Quadra 800 (m68k, TCG) -> Mac OS 7.5.3 quiet Finder desktop.
    # TWO writable disks and BOTH must be cloned: QEMU puts the vmstate in the
    # FIRST snapshot-capable drive, which here is the 256-byte PRAM, not the
    # hard disk. Cloning only macos753-golden.qcow2 would clone a checkpoint
    # with no machine state in it.
    BR_CANVAS_W=1152
    BR_CANVAS_H=870
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_DISKS="macos753-golden.qcow2 pram-golden.qcow2"
    # TIER 1 is right here: a Mac cold boot is a sequence of clearly distinct
    # still frames (Happy Mac, grey desktop, menu bar) and the fixture is a
    # dead-still grey field, so the change-fraction detector settles cleanly.
    # Generous MAX: this is TCG with no acceleration path at all.
    BR_DETECT_TIER=1
    BR_CF_THRESHOLD="0.002"
    BR_SETTLE_MS=4000
    BR_MAX_MS=240000
    ;;
  ravynos) # ravynOS 0.6.1 live ISO (UEFI/q35, KVM) -> LoginWindow. A COLD BOOT
    # DOES NOT REACH THIS STATION'S GOLDEN and cannot be made to: the LoginWindow
    # waits for a human forever, and 0.6.1 has no autologin to switch on (its
    # config lives in a read-only uzip on the ISO, and there is no Filer or
    # Settings app to change it from the desktop). The golden IS the zero-input
    # path here. A clip recorded by this arm therefore ends at the LoginWindow
    # while the golden begins at the desktop, so it CANNOT satisfy the
    # last-frame == first-live-frame invariant: no boot video is recommended for
    # this station and spa.bootVideo is deliberately unset. See
    # ravynos-zero-input-prep.md for the driven-login sequence and coordinates.
    BR_BOOT_KIND="vmstate"
    # Canvas is fixed at boot by OVMF's EFI GOP (1280x800). ravynOS ships no GPU
    # driver at all -- WindowServer paints straight into that framebuffer -- so
    # the guest can never change it and the canvas is exact, not letterboxed.
    BR_CANVAS_W=1280
    BR_CANVAS_H=800
    BR_FPS=30
    # -audiodev dbus,out.frequency=48000,out.channels=2,out.format=s16 + intel-hda
    # (attached in-guest as pcm0). The 0.6.1 desktop emits no sounds of its own.
    BR_HAS_AUDIO=1
    BR_AUDIO_RATE=48000
    BR_AUDIO_CH=2
    # BOTH writable disks, and the CARRIER FIRST. The live ISO is read-only and
    # cannot hold a vmstate, so ravynos-golden.qcow2 exists purely to carry the
    # golden's RAM image; savevm picks its vmstate device by command-line order,
    # so a clone that omits or reorders these lands the RAM image in the 528 KiB
    # UEFI variable store instead. Never attach the live copies.
    BR_DISKS="ravynos-golden.qcow2 OVMF_VARS.qcow2"
    # No hostfwd and no fixed helper port: the launcher's user net is restrict=on
    # with no forwards at all, so there is nothing to rewrite.
    # TIER 3, not tier 1: a zero-input run has no settling desktop to detect, only
    # a LoginWindow that never changes again -- and the desktop it would settle on
    # has a menu-bar clock that repaints once a minute and cannot be hidden.
    # LoginWindow lands at ~95-110 s; the timer is set past that with headroom.
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=130000
    BR_MAX_MS=210000
    # No record driver: the login sequence is framebuffer-asserted supervised work
    # (activate the panel, click the field twice, type liveuser, click Log In) and
    # must never be blind-sent on a timer.
    ;;
  *)
    br_die "no bootrec config for tile '$t' — add a case arm in bootrec-tiles.conf"
    ;;
  dragon32) # bridge kiosk -> MAME 0.289 `dragon32 -ext ""` -> Microsoft 16K
    # Extended Color BASIC. Nothing is curated into the fixture, so a cold boot
    # reaches the same three-line banner the golden holds and a clip hands off
    # cleanly -- see dragon32-zero-input-prep.md.
    BR_BOOT_KIND="bridge"
    BR_CANVAS_W=1024
    BR_CANVAS_H=768
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_AUDIO_RATE=48000
    BR_AUDIO_CH=2
    BR_HOSTFWD_ORIG=5833
    BR_HOSTFWD_CLONE=6833
    BR_DISKS="overlay.qcow2"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=45000
    BR_MAX_MS=90000
    BR_EMU_SSH_PORT=6833
    BR_EMU_SSH_KEY="/data/vms/bridge/bridge_key"
    # The process is `dragon`, not `mame`: this tile ships a MAME
    # SUBTARGET=dragon build as /opt/dragon32/mame/dragon, so mpf2's
    # `pkill -u bridge mame` would match nothing and prep would no-op.
    BR_EMU_PREP_CMD="systemctl stop getty@tty1; pkill -u bridge -x dragon 2>/dev/null || true"
    BR_EMU_BOOT_CMD="systemctl start getty@tty1"
    ;;
  oricatmos) # bridge kiosk -> MAME 0.289 `orica` -> Oric Extended BASIC V1.1.
    # Nothing is curated into the golden and no post-restore keys are sent, so
    # a cold boot reaches the SAME screen the golden holds and a clip hands off
    # cleanly. The launcher re-asserts the 800x600 mode and then sleeps 2 s
    # before exec'ing MAME, so the first seconds are a black root -- trim to
    # the first frame with the white page in it. See
    # oricatmos-zero-input-prep.md.
    BR_BOOT_KIND="bridge"
    BR_CANVAS_W=800
    BR_CANVAS_H=600
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_AUDIO_RATE=48000
    BR_AUDIO_CH=2
    BR_HOSTFWD_ORIG=5834
    BR_HOSTFWD_CLONE=6834
    BR_DISKS="overlay.qcow2"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=45000
    BR_MAX_MS=90000
    BR_EMU_SSH_PORT=6834
    BR_EMU_SSH_KEY="/data/vms/bridge/bridge_key"
    # The MAME subtarget binary is literally named `oricatmos`, which is also
    # this tile's name: `pkill -f oricatmos` would match the recording shell's
    # own command line, so kill by exact process name only.
    BR_EMU_PREP_CMD="systemctl stop getty@tty1; pkill -u bridge -x oricatmos 2>/dev/null || true"
    BR_EMU_BOOT_CMD="systemctl start getty@tty1"
    ;;
  sinclairql) # bridge kiosk -> MAME `ql` -> QDOS/SuperBASIC. UNLIKE every other
    # bridge arm here, a cold boot does NOT reach this tile's golden on its own:
    # MAME's permanent imperfect-dump warning (the QL's hal16l8.ic38 PLD has never
    # been dumped) and then the machine's own `F1...monitor / F2...TV` chooser both
    # wait for a key. A clip that hands off to the live tile therefore needs a
    # record driver that repeats the builder's three framebuffer-asserted steps --
    # letter, chooser, F1 -- and none exists yet, so this arm as written records
    # only as far as the chooser. See sinclairql-zero-input-prep.md.
    BR_BOOT_KIND="bridge"
    BR_CANVAS_W=1024
    BR_CANVAS_H=768
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_AUDIO_RATE=48000
    BR_AUDIO_CH=2
    BR_HOSTFWD_ORIG=5836
    BR_HOSTFWD_CLONE=6836
    BR_DISKS="overlay.qcow2"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=60000
    BR_MAX_MS=120000
    BR_EMU_SSH_PORT=6836
    BR_EMU_SSH_KEY="/data/vms/bridge/bridge_key"
    BR_EMU_PREP_CMD="systemctl stop getty@tty1; pkill -u bridge -x mame 2>/dev/null || true"
    BR_EMU_BOOT_CMD="systemctl start getty@tty1"
    ;;

<<<<<<< HEAD
    armeval)  # bridge kiosk -> MAME 0.289 `bbcb -tube arm` -> the ARM Evaluation
      # System. UNLIKE every other bridge arm in this file, ZERO INPUT DOES NOT
      # REACH THIS TILE'S GOLDEN, and that is a property of the exhibit, not a bug
      # to be fixed here: the ARM board has no operating system and no language of
      # its own, so a cold boot stops at the supervisor's blue `A*` prompt while the
      # golden holds ARM BBC Basic V, loaded off Disc 3 by two commands baked in at
      # bake time (`*LIB $` then `AB`). A clip recorded by this arm therefore ends
      # ~8k lit pixels SHORT of the golden's first frame and would visibly jump at
      # the hand-off. Recording a clip that hands off cleanly needs a record driver
      # that repeats those two framebuffer-asserted steps at the tile's own 80/80
      # pacing; none exists yet. See armeval-zero-input-prep.md.
      BR_BOOT_KIND="bridge"
      BR_CANVAS_W=800; BR_CANVAS_H=600; BR_FPS=30
      BR_HAS_AUDIO=1; BR_AUDIO_RATE=48000; BR_AUDIO_CH=2
      BR_HOSTFWD_ORIG=5838; BR_HOSTFWD_CLONE=6838
      BR_DISKS="overlay.qcow2"
      BR_DETECT_TIER=3; BR_TIER3_TIMER_MS=60000; BR_MAX_MS=120000
      BR_EMU_SSH_PORT=6838; BR_EMU_SSH_KEY="/data/vms/bridge/bridge_key"
      # Resolve the emulator through /proc/<pid>/exe rather than trusting the name:
      # `bbcb` is a short subtarget name, the guest also carries the distro `mame`
      # package (installed for its SDL libraries, never launched), and the bbcmicro
      # tile's binary has the SAME name at a DIFFERENT path — so a name-only kill
      # here is one typo away from reaching for a sibling exhibit's process.
      BR_EMU_PREP_CMD="systemctl stop getty@tty1; for p in \$(pgrep -x bbcb); do [ \"\$(readlink /proc/\$p/exe)\" = /opt/armeval/mame/bbcb ] && kill -9 \$p; done; true"
      BR_EMU_BOOT_CMD="systemctl start getty@tty1"
      ;;
    bbcmicro)  # bridge kiosk -> MAME 0.289 `bbcb` -> the BBC Micro Model B's own
      # power-on banner and BASIC prompt. Nothing is curated into the fixture and
      # no keys are sent after a restore, so a cold boot reaches exactly the screen
      # the golden holds and a clip hands off cleanly -- see
      # bbcmicro-zero-input-prep.md. Full 1024x768 root: MAME runs fullscreen with
      # -keepaspect, unlike the VICE tiles whose fixed SDL window shrinks the root.
      BR_HOSTFWD_ORIG=5832; BR_HOSTFWD_CLONE=6832
      BR_EMU_SSH_PORT=6832; BR_EMU_SSH_KEY="/data/vms/bridge/bridge_key"
      # Resolve the emulator through /proc/<pid>/exe rather than trusting the
      # name: `bbcb` is a short subtarget name and the guest also carries the
      # distro `mame` package (installed for its SDL libraries, never launched).
      BR_EMU_PREP_CMD="systemctl stop getty@tty1; for p in \$(pgrep -x bbcb); do [ \"\$(readlink /proc/\$p/exe)\" = /opt/bbcmicro/mame/bbcb ] && kill -9 \$p; done; true"
      ;;
    pcgeos)  # PC/GEOS Ensemble (bluewaysw) on FreeDOS 1.3, vmstate/loadvm. Fields
      # confirmed 2026-09-02 on a /data/vms/sandbox CLONE against the launcher
      # streamhost/stations/pcgeos/qemu-streamhost.sh (pc-i440fx-11.0,acpi=off /
      # cpu host / -vga std 800x600 VESA / sb16+pcspk dbus audio / ne2k_pci user-net
      # / IDE golden). disk.qcow2 is the ONLY block device and carries the golden.
      BR_BOOT_KIND="vmstate"
      BR_CANVAS_W=800; BR_CANVAS_H=600; BR_FPS=30
      BR_HAS_AUDIO=1; BR_AUDIO_RATE=48000; BR_AUDIO_CH=2   # sb16 dbus 48000/2/s16
      BR_DISKS="disk.qcow2"
      ;;
    alto)  # bridge kiosk -> ContrAlto 2 -> the Xerox Alto Executive. PORTRAIT
      # CANVAS, and the only one in this file: the X root is 608x808 because
      # that is the Alto's own bitmap, so a recorder that assumes landscape will
      # letterbox a clip the live tile does not letterbox.
      # Nothing is curated into the fixture and nothing is typed after a restore,
      # so a cold boot reaches exactly the screen the golden holds and a clip
      # hands off with no seam -- see alto-zero-input-prep.md.
      # NO AUDIO: the Alto has no sound hardware at all (the AC97 card exists
      # only for device-set parity), so a recorder gating on non-silent audio
      # will hang.
      BR_BOOT_KIND="bridge"
      BR_CANVAS_W=608; BR_CANVAS_H=808; BR_FPS=30
      BR_HAS_AUDIO=0
