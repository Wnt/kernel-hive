#!/bin/bash
# bootrec-tiles.conf — per-tile capture parameters (DATA, sourced by record-boot.sh
# and detect-interactive.sh). `bootrec_load_tile <tile>` populates BR_* globals from
# the case block below; add a tile by adding a case arm. Values marked (box) must be
# confirmed against the live launcher before the first real record of that tile.
#
# Fields:
#   BR_BOOT_KIND   vmstate | bridge | restart
#       vmstate: cold-launch the clone WITHOUT loadvm golden, detect settle, pause,
#                poster, savevm golden ON THE PAUSED STATE, verify (the §3.1 invariant).
#       bridge : loadvm the kiosk golden, ssh the in-kiosk emulator cold-boot trigger,
#                record that; SKIP savevm/verify (the emulator cold-boots per visit).
#       restart: the boot artifact itself is golden (ISO/raw base/-snapshot disk);
#                record its deterministic cold boot, SKIP savevm/loadvm verification.
#   BR_CANVAS_W/H  final desktop resolution — the FIXED canvas the dbus tap normalises
#                  every frame to (letterboxing SeaBIOS/boot modes). Sidesteps §2.3.
#   BR_FPS         constant record fps the tap paces to (delivered clip; 30 is plenty).
#   BR_HAS_AUDIO   1 -> mux guest PCM (tap opens the audio fifo); 0 -> -an, no fifo.
#   BR_AUDIO_RATE/BR_AUDIO_CH  PCM format the tap emits (matches the tile -audiodev).
#   BR_HOSTFWD_ORIG/BR_HOSTFWD_CLONE  the launcher's guest hostfwd port and the bumped
#                  clone port (rewritten in the copied launcher; avoids colliding with
#                  the LIVE tile's forward).
#   BR_DISKS       space-separated qcow2 basenames under the tile dir to copy into the
#                  clone (savevm on a vmstate clone writes the COPY, never live).
#   BR_EXTERNAL_DISKS bash array of "absolute-source|clone-basename" entries. Each
#                  writable disk outside the tile dir is copied and its launcher path
#                  rewritten to the clone. Never point a clone at a live writable disk.
#   BR_GOLDEN_DISK basename of the clone disk whose snapshot list fingerprints the bake;
#                  defaults to the first BR_DISKS entry (set it for external stores).
#   BR_PORT_REWRITES bash array of "live:clone" fixed TCP ports not covered by hostfwd.
#   BR_DETECT_TIER 1 (framebuffer-stability) | 2 (reference-region) | 3 (fixed timer).
#   BR_CF_THRESHOLD/BR_SETTLE_MS         Tier-1: cf<thr held for settle window.
#   BR_REF_PNG/BR_REF_CROP/BR_REF_MATCH_K Tier-2: crop region SSIM vs a reference PNG,
#                  K consecutive matches (BR_REF_CROP is an ffmpeg crop=w:h:x:y).
#   BR_TIER3_TIMER_MS                    Tier-3: fixed settle wall-clock.
#   BR_MAX_MS      hard cap on the detect wait (all tiers) — a bounded recording.
#   BR_EMU_BOOT_CMD/BR_EMU_SSH_PORT/BR_EMU_SSH_KEY  bridge-only: cold-boot the in-kiosk
#                  emulator over ssh (the clone's bumped forward).
#   BR_EMU_PREP_CMD bridge-only optional command run before capture to stop the emulator,
#                  ensuring frame zero is the emulator's real powered-off/black surface.
#   BR_BOOT_DRIVER  optional sibling helper run after capture starts and before detection;
#                  automates unavoidable firmware/LiveCD dialogs (never human input).

bootrec_load_tile() {
  local t="$1"
  # ---- shared defaults (overridden per tile) ----
  BR_TILE="$t"
  BR_BOOT_KIND="vmstate"
  BR_CANVAS_W=640
  BR_CANVAS_H=480
  BR_FPS=30
  BR_CRF=18 # delivered boot.mp4 x264 crf (compactness vs last-frame fidelity)
  BR_HAS_AUDIO=0
  BR_AUDIO_RATE=48000
  BR_AUDIO_CH=2
  BR_HOSTFWD_ORIG=""
  BR_HOSTFWD_CLONE=""
  BR_DISKS=""
  BR_EXTERNAL_DISKS=()
  BR_GOLDEN_DISK=""
  BR_PORT_REWRITES=()
  BR_DETECT_TIER=1
  BR_CF_THRESHOLD="0.005"
  BR_SETTLE_MS=3000
  BR_REF_PNG=""
  BR_REF_CROP=""
  BR_REF_MATCH_K=3
  BR_TIER3_TIMER_MS=75000
  BR_MAX_MS=180000
  BR_EMU_PREP_CMD=""
  BR_EMU_BOOT_CMD=""
  BR_EMU_SSH_PORT=""
  BR_EMU_SSH_KEY=""
  BR_BOOT_DRIVER=""

  case "$t" in
  amiga) # emulator-bridge (FS-UAE in a Debian-12 kiosk); cold-boot per visit, no savevm.
    # All fields confirmed 2026-07-13 against the LIVE launcher
    # /data/vms/streamhost/stations/amiga/qemu-streamhost.sh, the kiosk .xinitrc, and
    # /etc/bridge/launch.sh (via ssh -i bridge_key -p 5818 root@127.0.0.1).
    BR_BOOT_KIND="bridge"
    # The QEMU dbus scanout (== the live stream) is the kiosk X screen, forced to
    # 1024x768 by ~/.xinitrc (`xrandr --mode 1024x768`); FS-UAE is a 720x568 window
    # centred on a black root. Canvas == scanout => the tap is a 1:1 copy and the
    # clip matches the live stream dimensions exactly.
    BR_CANVAS_W=1024
    BR_CANVAS_H=768
    BR_FPS=30
    # -audiodev dbus,id=snd0,out.frequency=48000,out.channels=2,out.format=s16
    # -device AC97 ; FS-UAE --audio_frequency=48000 (Paula->ALSA->AC97).
    BR_HAS_AUDIO=1
    BR_AUDIO_RATE=48000
    BR_AUDIO_CH=2
    BR_HOSTFWD_ORIG=5818
    BR_HOSTFWD_CLONE=6818    # live hostfwd :5818-:22 -> clone :6818
    BR_DISKS="overlay.qcow2" # thin overlay on shared read-only base
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=75000
    BR_MAX_MS=120000 # ~60-75s to Workbench 1.3
    BR_REF_PNG=""
    BR_REF_CROP="" # no Tier-2 confirm yet (pure fixed timer)
    BR_EMU_SSH_PORT=6818
    BR_EMU_SSH_KEY="/data/vms/bridge/bridge_key" # root@127.0.0.1
    # Fresh NVMe rebuilds carry the plain getty/X launcher rather than the
    # optional per-visit supervisor. Stop the login session before capture,
    # then start it to launch a genuinely fresh FS-UAE process.
    BR_EMU_PREP_CMD="systemctl stop getty@tty1; pkill -u bridge fs-uae 2>/dev/null || true"
    BR_EMU_BOOT_CMD="systemctl start getty@tty1"
    ;;    # cold-relaunch from a fresh Workbench ADF
  alpine) # Alpine 3.24 LiveCD -> root tty; scratch IDE qcow2 holds vmstate.
    BR_CANVAS_W=1280
    BR_CANVAS_H=800
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_DISKS="state.qcow2"
    BR_PORT_REWRITES=("5881:6881")
    BR_BOOT_DRIVER="alpine-record-driver.sh"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=5000
    BR_MAX_MS=30000
    ;;
  tinycore) # TinyCore 15 LiveCD -> FLWM/wbar; scratch virtio qcow2 holds vmstate.
    BR_CANVAS_W=1024
    BR_CANVAS_H=768
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_DISKS="state.qcow2"
    BR_PORT_REWRITES=("5882:6882")
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=35000
    BR_MAX_MS=90000
    ;;
  toaruos) # remastered deterministic ISO is the golden; no snapshottable disk.
    BR_BOOT_KIND="restart"
    BR_CANVAS_W=1920
    BR_CANVAS_H=1080
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=45000
    BR_MAX_MS=120000
    ;;
  aros) # AROS pc-i386 LiveCD; scratch IDE qcow2 holds the new cold-boot golden.
    BR_CANVAS_W=1024
    BR_CANVAS_H=768
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_DISKS="golden-scratch.qcow2"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=65000
    BR_MAX_MS=150000
    ;;
  helenos) # HelenOS 0.14.1 LiveCD -> compositor; scratch IDE vmstate store.
    BR_CANVAS_W=1024
    BR_CANVAS_H=768
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_DISKS="golden.qcow2"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=60000
    BR_MAX_MS=150000
    ;;
  kolibrios) # KolibriOS LiveCD -> desktop; scratch virtio vmstate store.
    BR_CANVAS_W=1024
    BR_CANVAS_H=768
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_DISKS="state.qcow2"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=20000
    BR_MAX_MS=60000
    ;;
  ninefront) # disk boot -> rio; external golden disk is always cloned first.
    BR_CANVAS_W=1920
    BR_CANVAS_H=1080
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_HOSTFWD_ORIG=57793
    BR_HOSTFWD_CLONE=58793
    BR_EXTERNAL_DISKS=("/data/gallery-guests/9front/9front-11554.amd64.qcow2|ninefront.qcow2")
    BR_GOLDEN_DISK="ninefront.qcow2"
    BR_BOOT_DRIVER="ninefront-record-driver.sh"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=3000
    BR_MAX_MS=120000
    ;;
  android) # Android-x86 disk boot; terminal fixture settings persist on disk.
    BR_CANVAS_W=1024
    BR_CANVAS_H=768
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_EXTERNAL_DISKS=("/data/gallery-guests/Android/android.qcow2|android.qcow2")
    BR_GOLDEN_DISK="android.qcow2"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=90000
    BR_MAX_MS=180000
    ;;
  redstar2) # Air-gapped Red Star 2 disk -> KDM auto-login -> KDE desktop.
    BR_BOOT_KIND="vmstate"
    BR_CANVAS_W=1024
    BR_CANVAS_H=768
    BR_FPS=30
    BR_HAS_AUDIO=0
    BR_EXTERNAL_DISKS=("/data/gallery-guests/RedStar2/redstar2.qcow2|redstar2.qcow2")
    BR_GOLDEN_DISK="redstar2.qcow2"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=60000
    BR_MAX_MS=120000
    ;;
  redstar3) # Air-gapped Red Star 3 disk -> KDM auto-login -> KDE desktop.
    BR_BOOT_KIND="vmstate"
    BR_CANVAS_W=1024
    BR_CANVAS_H=768
    BR_FPS=30
    BR_HAS_AUDIO=0
    BR_EXTERNAL_DISKS=("/data/gallery-guests/RedStar3/redstar3.qcow2|redstar3.qcow2")
    BR_GOLDEN_DISK="redstar3.qcow2"
    BR_BOOT_DRIVER="redstar3-record-driver.sh"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=45000
    BR_MAX_MS=90000
    ;;
  ubuntu) # Ubuntu 4.10 Warty Warthog LIVE CD -> GNOME 2.8 desktop, vmstate.
    # The CD is the OS; ubuntu.qcow2 is an otherwise-empty 1G carrier that only holds
    # the `golden` vmstate (savevm), same shape as redstar2. -cdrom is READ-ONLY media
    # at its live gallery-guests path (warty-release-live-i386.iso) — not cloned, not
    # in BR_EXTERNAL_DISKS (that array is for WRITABLE state only); only the qcow2 needs
    # a per-clone copy. Screen shipped at 640x480 (XFree86 vesa, no DDC) — golden stream
    # tried 1024x768 and ran out of time budget; see docs/lab/UBUNTU-WAVE.md.
    BR_BOOT_KIND="vmstate"
    BR_CANVAS_W=640
    BR_CANVAS_H=480
    BR_FPS=30
    BR_HAS_AUDIO=0
    BR_EXTERNAL_DISKS=("/data/gallery-guests/Ubuntu/ubuntu.qcow2|ubuntu.qcow2")
    BR_GOLDEN_DISK="ubuntu.qcow2"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=90000
    BR_MAX_MS=180000
    ;;
  win311) # DOS 6.22 -> WfW 3.11 -> auto-opened Notepad, two-disk vmstate.
    BR_CANVAS_W=640
    BR_CANVAS_H=480
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_DISKS="win311-golden.qcow2 games-golden.qcow2"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=40000
    BR_MAX_MS=90000
    ;;
  freedos) # FreeDOS 1.3 FDAUTO.BAT -> deterministic retro-games menu.
    BR_CANVAS_W=720
    BR_CANVAS_H=400
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_EXTERNAL_DISKS=("/data/gallery-guests/FreeDOS/freedos.qcow2|freedos.qcow2")
    BR_GOLDEN_DISK="freedos.qcow2"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=12000
    BR_MAX_MS=60000
    ;;
  msdoswin1) # DOS AUTOEXEC.BAT -> Windows 1.01 MS-DOS Executive.
    BR_CANVAS_W=640
    BR_CANVAS_H=350
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_EXTERNAL_DISKS=("/data/gallery-guests/MSDOSWin1/msdos-win1.qcow2|msdos-win1.qcow2")
    BR_GOLDEN_DISK="msdos-win1.qcow2"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=20000
    BR_MAX_MS=60000
    ;;
  bootos) # bootOS 512-byte boot-sector OS: SeaBIOS -> floppy -> the `$` prompt.
    # Fields confirmed 2026-09-02 on a clone (/data/vms/sandbox/bootos-golden/):
    # the 360K floppy AS qcow2 is the ONLY block device and holds the golden
    # vmstate, so it is the one disk to clone. 720x400 VGA text mode; the PC
    # speaker is wired to the dbus audiodev (pcspk-audiodev=snd0, proven with a
    # typed-in 1 kHz beep). Ready = the `$` prompt ~3 s after power-on and then
    # only the 9x2 px text caret blinks, so a fixed timer like the DOS siblings
    # (freedos) is the honest detector -- see bootos-zero-input-prep.md.
    BR_CANVAS_W=720
    BR_CANVAS_H=400
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_AUDIO_RATE=48000
    BR_AUDIO_CH=2
    BR_DISKS="floppy.qcow2"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=12000
    BR_MAX_MS=60000
    ;;
  qnx) # QNX 6.5 LiveCD requires a fully automated F2/display/login driver.
    BR_CANVAS_W=800
    BR_CANVAS_H=600
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_DISKS="golden.qcow2"
    BR_PORT_REWRITES=("7112:17112")
    BR_BOOT_DRIVER="qnx-record-driver.sh"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=10000
    BR_MAX_MS=60000
    ;;
  sailfishos) # ephemeral -snapshot disk; current image cold-boots without a vmstate reset.
    BR_BOOT_KIND="restart"
    BR_CANVAS_W=720
    BR_CANVAS_H=400
    BR_FPS=30
    BR_HAS_AUDIO=0
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=180000
    BR_MAX_MS=240000
    ;;
  templeos) # ISO/RAM guest; automate the two first-boot questions, then savevm.
    BR_CANVAS_W=640
    BR_CANVAS_H=480
    BR_FPS=30
    BR_HAS_AUDIO=0
    BR_DISKS="state.qcow2"
    BR_BOOT_DRIVER="templeos-record-driver.sh"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=15000
    BR_MAX_MS=60000
    ;;
  serenityos) # non-migratable NVMe: fresh overlay over read-only raw golden.
    BR_BOOT_KIND="restart"
    BR_CANVAS_W=1024
    BR_CANVAS_H=768
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=75000
    BR_MAX_MS=150000
    ;;
  postmarketos) # UEFI portrait disk + writable qcow2 varstore; both are cloned.
    BR_CANVAS_W=720
    BR_CANVAS_H=1440
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_DISKS="OVMF_VARS.qcow2"
    BR_EXTERNAL_DISKS=("/data/gallery-guests/postmarketOS/pmos-phosh.qcow2|pmos-phosh.qcow2")
    BR_GOLDEN_DISK="pmos-phosh.qcow2"
    BR_BOOT_DRIVER="postmarketos-record-driver.sh"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=30000
    BR_MAX_MS=120000
    ;;
  c64) # bridge kiosk -> VICE x64sc -> C64 GEOS 2.0.
    BR_BOOT_KIND="bridge"
    BR_CANVAS_W=1024
    BR_CANVAS_H=768
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_AUDIO_RATE=48000
    BR_AUDIO_CH=2
    BR_HOSTFWD_ORIG=5814
    BR_HOSTFWD_CLONE=6814
    BR_DISKS="overlay.qcow2"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=100000
    BR_MAX_MS=150000
    BR_EMU_SSH_PORT=6814
    BR_EMU_SSH_KEY="/data/vms/bridge/bridge_key"
    BR_EMU_PREP_CMD="systemctl stop getty@tty1; pkill -u bridge x64sc 2>/dev/null || true"
    BR_EMU_BOOT_CMD="systemctl start getty@tty1"
    ;;
  atarist) # bridge kiosk -> Hatari -> EmuTOS GEM.
    BR_BOOT_KIND="bridge"
    BR_CANVAS_W=1024
    BR_CANVAS_H=768
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_AUDIO_RATE=48000
    BR_AUDIO_CH=2
    BR_HOSTFWD_ORIG=5816
    BR_HOSTFWD_CLONE=6816
    BR_DISKS="overlay.qcow2"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=50000
    BR_MAX_MS=90000
    BR_EMU_SSH_PORT=6816
    BR_EMU_SSH_KEY="/data/vms/bridge/bridge_key"
    BR_EMU_PREP_CMD="systemctl stop getty@tty1; pkill -u bridge hatari 2>/dev/null || true"
    BR_EMU_BOOT_CMD="systemctl start getty@tty1"
    ;;
  apple2) # bridge kiosk -> LinApple -> Apple //e GEOS.
    BR_BOOT_KIND="bridge"
    BR_CANVAS_W=1024
    BR_CANVAS_H=768
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_AUDIO_RATE=48000
    BR_AUDIO_CH=2
    BR_HOSTFWD_ORIG=5817
    BR_HOSTFWD_CLONE=6817
    BR_DISKS="overlay.qcow2"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=60000
    BR_MAX_MS=120000
    BR_EMU_SSH_PORT=6817
    BR_EMU_SSH_KEY="/data/vms/bridge/bridge_key"
    BR_EMU_PREP_CMD="systemctl stop pointer-watchdog.service getty@tty1; pkill -u bridge linapple 2>/dev/null || true"
    BR_EMU_BOOT_CMD="systemctl start getty@tty1; systemctl start pointer-watchdog.service"
    ;;
  vic20) # bridge kiosk -> VICE xvic -> VIC-20 CBM BASIC V2. Same shape as the
    # c64 arm (same emulator, same overlay-on-frozen-base layout); the ROM comes
    # up in seconds, so the Tier-3 hold is short.
    BR_BOOT_KIND="bridge"
    BR_CANVAS_W=1024
    BR_CANVAS_H=768
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_AUDIO_RATE=48000
    BR_AUDIO_CH=2
    BR_HOSTFWD_ORIG=5821
    BR_HOSTFWD_CLONE=6821
    BR_DISKS="overlay.qcow2"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=45000
    BR_MAX_MS=90000
    BR_EMU_SSH_PORT=6821
    BR_EMU_SSH_KEY="/data/vms/bridge/bridge_key"
    BR_EMU_PREP_CMD="systemctl stop getty@tty1; pkill -u bridge xvic 2>/dev/null || true"
    BR_EMU_BOOT_CMD="systemctl start getty@tty1"
    ;;
  plus4) # bridge kiosk -> VICE xplus4 -> Commodore BASIC V3.5. Since the golden
    # was re-baked at the machine's own power-on screen (2026-08-09), a cold boot
    # and a restore now reach the SAME screen, so a clip hands off cleanly --
    # see plus4-zero-input-prep.md.
    BR_BOOT_KIND="bridge"
    BR_CANVAS_W=1024
    BR_CANVAS_H=768
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_AUDIO_RATE=48000
    BR_AUDIO_CH=2
    BR_HOSTFWD_ORIG=5822
    BR_HOSTFWD_CLONE=6822
    BR_DISKS="overlay.qcow2"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=45000
    BR_MAX_MS=90000
    BR_EMU_SSH_PORT=6822
    BR_EMU_SSH_KEY="/data/vms/bridge/bridge_key"
    BR_EMU_PREP_CMD="systemctl stop getty@tty1; pkill -u bridge xplus4 2>/dev/null || true"
    BR_EMU_BOOT_CMD="systemctl start getty@tty1"
    ;;
  c128) # bridge kiosk -> VICE x128 -pal -80col -> Commodore BASIC V7.0 on the
    # VDC's 80-column display. Nothing is curated into the fixture, so a cold
    # boot reaches the same screen the golden holds. The CP/M system disk is
    # attached to drive 8 AFTER the emulator settles and is NOT booted -- a clip
    # that runs long enough to catch the attach shows no visible change.
    BR_BOOT_KIND="bridge"
    BR_CANVAS_W=800
    BR_CANVAS_H=600
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_AUDIO_RATE=48000
    BR_AUDIO_CH=2
    BR_HOSTFWD_ORIG=5823
    BR_HOSTFWD_CLONE=6823
    BR_DISKS="overlay.qcow2"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=45000
    BR_MAX_MS=90000
    BR_EMU_SSH_PORT=6823
    BR_EMU_SSH_KEY="/data/vms/bridge/bridge_key"
    BR_EMU_PREP_CMD="systemctl stop getty@tty1; pkill -u bridge x128 2>/dev/null || true"
    BR_EMU_BOOT_CMD="systemctl start getty@tty1"
    ;;
  pet2001) # bridge kiosk -> VICE xpet -model 2001 -> COMMODORE BASIC (1977).
    # A cold boot reaches the SAME screen the golden holds (nothing is curated),
    # so a clip hands off cleanly -- but it passes through 720x400 VGA text on
    # the way; trim to the moment the 800x600 X root appears. See
    # pet2001-zero-input-prep.md.
    BR_BOOT_KIND="bridge"
    BR_CANVAS_W=800
    BR_CANVAS_H=600
    BR_FPS=30
    BR_HAS_AUDIO=1
    BR_AUDIO_RATE=48000
    BR_AUDIO_CH=2
    BR_HOSTFWD_ORIG=5824
    BR_HOSTFWD_CLONE=6824
    BR_DISKS="overlay.qcow2"
    BR_DETECT_TIER=3
    BR_TIER3_TIMER_MS=45000
    BR_MAX_MS=90000
    BR_EMU_SSH_PORT=6824
    BR_EMU_SSH_KEY="/data/vms/bridge/bridge_key"
    BR_EMU_PREP_CMD="systemctl stop getty@tty1; pkill -u bridge xpet 2>/dev/null || true"
    BR_EMU_BOOT_CMD="systemctl start getty@tty1"
    ;;
  cbm8032) # bridge kiosk -> VICE xpet -model 8032 -> Commodore BASIC 4.0.
    # A cold boot reaches the SAME screen the golden holds (nothing is curated),
    # so a clip hands off cleanly -- see cbm8032-zero-input-prep.md. Canvas is
    # the 1600x1200 X root this tile needs to contain its 1408x1064 SDL window.
    # AUDIO IS CARRIED AND SILENT: the AC97 path exists, the 8032 has no sound
    # generator at all.
    BR_BOOT_KIND="bridge"
    BR_CANVAS_W=1600
