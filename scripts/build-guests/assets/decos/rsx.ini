; RSX-11M V4.2 BL38 on a PDP-11/70 with an RD52 pack. Built by
; scripts/build-guests/decos.sh.
;
; NOT V4.3. See docs/guests/decos.md: V4.3 media is not reachable anywhere
; today, V4.2 BL38 is, and the exhibit says so rather than pretending.
;
; NOTE for anyone copying an 11/44 ini off the internet: `set cpu 11/70`
; REJECTS both `nocis` and `set rha disabled`, which the widely-mirrored ak6dn
; configuration carries. Leave them out.
;
; The two EXPECT lines answer STARTUP.CMD's date/time and terminal-width
; questions. SIMH's EXPECT does fire here (it did not against 2.11BSD's boot
; prompt during recon, which is why the BUILD path uses a forkpty driver
; instead) and it keeps the visitor out of a dialogue they cannot guess.
set cpu 11/70
set cpu 4M
set cpu idle
set rq0 rd52
attach rq0 @DISK@
expect "DD-MMM-YY) [S]: " send "@RSXDATE@\r"; continue
expect "TERMINAL [D D:132.]: " send "80.\r"; continue
boot rq0
