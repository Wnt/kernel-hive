; RSTS/E V9.6 on a PDP-11/70 with an RD54 pack. Built by
; scripts/build-guests/decos.sh.
;
; THE DATE IS FIXED AT 1990 ON PURPOSE. RSTS/E V9.6 stores a two-digit year,
; reads it as 19xx, and rejects any date earlier than the kit: measured on this
; media, "7-SEP-85" (INIT's own printed example) is refused and "31-DEC-90" is
; accepted. A 2026 date is therefore not expressible. Rather than feed the
; machine a hybrid of today's day and a made-up year, the exhibit pins the
; clock and the guest doc says why.
set cpu 11/70
set cpu 4M
set cpu idle
set rq0 rd54
attach rq0 @DISK@
expect "Today's date? " send "9-AUG-90\r"; continue
expect "Current time? " send "10:00 AM\r"; continue
expect "Start timesharing? <Yes> " send "\r"; continue
boot rq0
