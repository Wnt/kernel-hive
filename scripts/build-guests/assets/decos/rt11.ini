; RT-11 V5.3 on a PDP-11/73 with an RL02 pack. Built by scripts/build-guests/decos.sh.
; RT-11 CANNOT BE IDLE-DETECTED. SIMH's PDP-11 idle detection fires on the
; WAIT instruction, and its own help says so: "This will work for RSTS/E and
; RSX-11M+, but not for RT-11 or UNIX." Measured on this tile, RT-11FB sitting
; at a bare "." prompt with `set cpu idle` still pinned a host core at 99%.
; `set throttle` is the answer, and it is not a compromise: a real 11/73 (J-11,
; 15 MHz) ran on the order of a million instructions a second, so throttling to
; that rate is closer to the exhibited machine than running flat out.
; `set cpu idle` is kept because it costs nothing and would help if a future
; RT-11 monitor did WAIT.
set cpu 11/73
set cpu 256k
set cpu idle
set throttle 1000K
set rl enabled
attach rl0 @DISK@
set rk disabled
set rx disabled
set tm disabled
boot rl0
