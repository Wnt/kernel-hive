lang en_US
keyboard us
mouse genericps/2
timezone --utc Etc/UTC
rootpw redhat62
auth --useshadow --enablemd5
lilo --location mbr --append "ide=nodma"
zerombr yes
clearpart --all
part / --size 1800 --grow
part swap --size 128
install
cdrom
network --bootproto dhcp
skipx
%packages
@ Base
@ X Window System
@ GNOME
@ KDE
@ Games
@ Graphics Manipulation
@ Multimedia Support
@ Mail/WWW/News Tools
XFree86-SVGA
%post
/usr/sbin/useradd gallery
echo gallery | /usr/bin/passwd --stdin gallery
echo GNOME > /etc/sysconfig/desktop
cat > /home/gallery/.Xclients <<'XCEOF'
#!/bin/sh
# gallery exhibit session: no screensaver/blanking, then the GNOME desktop
xset s off
xset s noblank
exec gnome-session
XCEOF
chmod 755 /home/gallery/.Xclients
chown gallery.gallery /home/gallery/.Xclients
echo 10.0.2.2 > /etc/X0.hosts
echo "10.0.2.2 slirphost" >> /etc/hosts
ln -sf ../../usr/X11R6/bin/XF86_SVGA /etc/X11/X
cat > /etc/X11/XF86Config <<'XEOF'
Section "Files"
    RgbPath "/usr/X11R6/lib/X11/rgb"
    FontPath "unix/:-1"
    FontPath "/usr/X11R6/lib/X11/fonts/misc/"
    FontPath "/usr/X11R6/lib/X11/fonts/75dpi/"
    FontPath "/usr/X11R6/lib/X11/fonts/Type1/"
EndSection
Section "ServerFlags"
EndSection
Section "Keyboard"
    Protocol "Standard"
    AutoRepeat 500 5
    XkbRules "xfree86"
    XkbModel "pc101"
    XkbLayout "us"
EndSection
Section "Pointer"
    Protocol "PS/2"
    Device "/dev/psaux"
    Emulate3Buttons
    Emulate3Timeout 50
EndSection
Section "Monitor"
    Identifier "Generic"
    VendorName "Unknown"
    ModelName "Unknown"
    HorizSync 31.5-64.3
    VertRefresh 50-90
    Modeline "1024x768" 65 1024 1032 1176 1344 768 771 777 806 -hsync -vsync
    Modeline "800x600" 40 800 840 968 1056 600 601 605 628 +hsync +vsync
EndSection
Section "Device"
    Identifier "Cirrus"
    VendorName "Cirrus"
    BoardName "GD5446"
    Chipset "clgd5446"
    VideoRam 4096
    Option "no_bitblt"
EndSection
Section "Screen"
    Driver "svga"
    Device "Cirrus"
    Monitor "Generic"
    DefaultColorDepth 16
    Subsection "Display"
        Depth 16
        Modes "1024x768"
        ViewPort 0 0
    EndSubsection
    Subsection "Display"
        Depth 8
        Modes "1024x768"
        ViewPort 0 0
    EndSubsection
EndSection
XEOF
# RH 6.2 ships GNU sed 3.02: NO `sed -i` (the golden stream found both inittab edits
# silently missing). perl -pi is the in-place editor here.
perl -pi -e 's/^id:3:initdefault:/id:5:initdefault:/; s|^x:5:respawn:.*|x:5:respawn:/bin/su - gallery -c /usr/X11R6/bin/startx >/dev/null 2>&1|' /etc/inittab
# Xwrapper runs PAM service "xserver" with pam_console; an inittab `su - gallery` owns no
# console and X dies with "Authentication failed - cannot start X server". Permit it.
perl -pi -e 's/pam_console/pam_permit/' /etc/pam.d/xserver
# anaconda sees QEMU's MP tables and installs kernel-smp as LILO's default label
# "linux" even with -smp 1. The SMP kernel routes IDE IRQ14 through the IO-APIC and
# loops on "hda: lost interrupt" (forever under TCG, ~30 s stalls under KVM). The UP
# kernel (label linux-up) boots cleanly under both; make it the default and rerun lilo.
perl -pi -e 's/^default=.*/default=linux-up/' /etc/lilo.conf
/sbin/lilo
# With the UP kernel under KVM, in-guest DMA engages (using_dma=1, ~65 MB/s buffered
# reads vs 512-byte PIO at ~27 KB/s). rc.local runs before the inittab X respawn.
echo "/sbin/hdparm -d1 /dev/hda" >> /etc/rc.d/rc.local
