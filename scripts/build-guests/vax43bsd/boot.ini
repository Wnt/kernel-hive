; phase 2+ — boot the installed disk. The DZ port is the visitor line; pick a
; namespaced one per sandbox (the station's own lives inside the container).
set rq0 ra81
att rq0 rq.dsk
set rq1 disable
set rq2 disable
set rq3 disable
set rp disable
set lpt disable
set rl disable
set tq disable
set tu disable
att -r ts 43.tap
set tti 7b
set tto 7b
set dz lines=8
set dz 7b
att dz 18209
load -o boot42 0
d r10 9
d r11 0
run 2
