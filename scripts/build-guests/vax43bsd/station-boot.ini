; UNATTENDED boot — no pty/expect supervisor. SIMH's own EXPECT/SEND answers
; the standalone boot prompt, so SIMH is the single supervised process in the
; station container. Proven 2026-09-20T09:25Z (~53 s to `login:`).
;
; The launcher templates <DZPORT> and the work-copy path before starting this.
set quiet
set rq0 ra81
att rq0 rq.dsk
set rq1 disable
set rq2 disable
set rq3 disable
set rp disable
set lpt disable
set rl disable
set tq disable
set tu disable
att -r ts 43.tap
set tti 7b
set tto 7b
set dz lines=8
set dz 7b
att dz <DZPORT>
set cpu idle=32v
load -o boot42 0
d r10 9
d r11 0
expect "Boot\r\n: " send "ra(0,0)vmunix\r"; go
expect "login: " echo KHBOOTREADY; go
run 2
