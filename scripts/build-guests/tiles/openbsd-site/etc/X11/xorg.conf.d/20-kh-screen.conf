# Kernel Hive: the Xorg vesa driver takes the largest VBE mode (1920x1200 on the
# bochs stdvga) regardless of the EDID preferred mode; pin the museum canvas.
Section "Monitor"
	Identifier "kh monitor"
	Option "PreferredMode" "1024x768"
EndSection
Section "Device"
	Identifier "kh vesa"
	Driver "vesa"
EndSection
Section "Screen"
	Identifier "kh screen"
	Device "kh vesa"
	Monitor "kh monitor"
	DefaultDepth 24
	SubSection "Display"
		Depth 24
		Modes "1024x768"
	EndSubSection
EndSection
