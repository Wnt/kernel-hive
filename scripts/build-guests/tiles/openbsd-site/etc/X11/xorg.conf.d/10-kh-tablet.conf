# Kernel Hive: QEMU usb-tablet -> ums0 -> wsmouse1 (type touch-panel). Xorg adds it
# TWICE: directly as /dev/wsmouse1 and again through the /dev/wsmouse mux, so every
# event moved the pointer twice. Ignore the direct node; drive through the mux, whose
# calibration range is unset by default (0..32767 then clamps to the screen corner).
Section "InputClass"
	Identifier "kh ignore direct wsmouse nodes"
	MatchDevicePath "/dev/wsmouse[0-9]*"
	Option "Ignore" "true"
EndSection
Section "InputClass"
	Identifier "kh usb-tablet calibration on the mux"
	MatchDevicePath "/dev/wsmouse"
	Option "MinX" "0"
	Option "MaxX" "32767"
	Option "MinY" "0"
	Option "MaxY" "32767"
EndSection
