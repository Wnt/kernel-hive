<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Kernel Hive — your account</title>
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<main>
  <h1 id="title">Your account</h1>
  <p class="sub" id="sub"></p>

  <h2>Link another device</h2>
  <div class="panel">
    <p class="sub">Scan this with the device you want to add. It joins <b>this same
      account</b></p>

    <div id="qr-wrap" class="hidden">
      <div class="qr" id="qr"></div>
      <div class="code-out" id="link-code"></div>
      <p class="meta" id="countdown"></p>
    </div>

    <div id="qr-expired" class="hidden">
      <p class="meta">That code has expired.</p>
    </div>

    <button id="make-link">Show a QR code</button>
  </div>

  <h2>Your passkeys</h2>
  <div class="panel" id="passkeys"></div>
  <div class="panel">
    <button id="add-passkey" class="secondary">Add a passkey for this device</button>
  </div>

  <div id="msg" class="msg"></div>
  <footer>
    <a href="/">← Back to the gallery</a>
    <span id="admin-link" class="hidden"> · <a href="/admin">Manage people</a></span>
  </footer>
</main>
<script type="module" src="/ui/account.js"></script>
</body>
</html>
