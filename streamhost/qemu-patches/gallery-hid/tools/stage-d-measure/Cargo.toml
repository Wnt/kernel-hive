[package]
name = "stage-d-measure"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
libc = "0.2"
nix = { version = "0.29", features = ["socket", "uio"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }

[profile.release]
strip = true
lto = true

# Keep the spike observer out of the parent streamhost workspace.
[workspace]
