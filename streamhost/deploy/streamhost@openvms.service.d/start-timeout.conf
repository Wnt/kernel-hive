# openvms is the only station whose ExecStartPre boots TWO VMs: a lean Debian
# Xorg bridge, which it then polls over ssh until the guest's Xorg is actually
# listening on :6000, and only then the OpenVMS guest itself. The shared
# streamhost@.service template allows TimeoutStartSec=90s, which is right for a
# single-VM station and is not enough of a backstop for this one.
#
# This is deliberately NOT the fix for the "restart reports failure while the
# station comes up healthy 30s later" bug -- that was the launcher's own outer
# readiness loop giving up at 40s, and it is fixed in
# streamhost/stations/openvms/qemu-streamhost.sh. On 2026-08-24 the failing
# start took 41s, so the 90s unit timeout was never reached and raising it
# alone would have changed nothing.
#
# What this drop-in does is keep systemd from becoming the NEW premature
# ceiling now that the launcher's backstop runs to 600s. Ordering must stay:
#   supervisor's own bounded waits (~520s worst case, and the only real
#   detector)  <  launcher backstop (600s)  <  TimeoutStartSec (900s).
# It is a backstop behind a backstop and is not expected to fire; a genuine
# failure is reported in seconds by the launcher's fail-fast on a dead
# supervisor.
#
# Per-station and not in the template on purpose: raising it there would
# lengthen the failure detection of all 60-odd single-VM stations to buy
# headroom only this one needs.
[Service]
TimeoutStartSec=900s
