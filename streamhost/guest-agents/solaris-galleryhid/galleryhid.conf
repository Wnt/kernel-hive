# Binding is installed by add_drv -i '"pci1b36,15"' galleryhid.
# Solaris 10's installed Xorg mouse module does not issue MSIOSRESOLUTION.
# These verified fixture dimensions seed pixel-valued absolute events; a
# later MSIOSRESOLUTION ioctl, when available, overrides them at runtime.
screen-width=1920;
screen-height=1200;
