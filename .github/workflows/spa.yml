# SPA CI for the gallery front-end (spa/, Vite + React + TypeScript).
#
# Runs only when the SPA (or this workflow) changes.
name: SPA

on:
  push:
    branches: [main]
    paths:
      - 'spa/**'
      - '.github/workflows/spa.yml'
  pull_request:
    paths:
      - 'spa/**'
      - '.github/workflows/spa.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spa/package-lock.json

      - run: npm ci

      - name: Lint (ESLint, zero warnings)
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build
